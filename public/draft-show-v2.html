<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>밴픽쇼 3D v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;600;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020408;font-family:'Noto Sans KR',sans-serif;color:#fff}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── screens ── */
.screen{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#020408}
#setupScreen{display:none}
.logo{font-family:'Rajdhani',sans-serif;font-size:3rem;font-weight:900;letter-spacing:8px;
  background:linear-gradient(135deg,#4dafff,#c8a84b,#ff6655);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub-logo{font-size:.85rem;letter-spacing:4px;color:rgba(148,163,184,.5);margin-top:-16px}
.load-bar-wrap{width:280px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.load-bar{height:100%;background:linear-gradient(90deg,#1a6ef0,#c8a84b,#e03020);width:0;transition:width .3s}
.load-status{font-size:.78rem;color:rgba(148,163,184,.45);letter-spacing:1px}
.setup-teams{display:flex;gap:44px;align-items:center}
.setup-team{display:flex;flex-direction:column;align-items:center;gap:8px}
.setup-team label{font-size:.75rem;letter-spacing:3px;font-weight:700}
.st-blue label{color:#4dafff}.st-red label{color:#ff6655}
.setup-team input{background:rgba(16,24,50,.9);border:1px solid rgba(77,159,255,.25);color:#fff;
  padding:9px 18px;border-radius:6px;font-size:1rem;text-align:center;
  font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1px;outline:none;width:190px}
.st-red input{border-color:rgba(220,60,40,.25)}
.setup-vs{font-family:'Rajdhani',sans-serif;font-size:2rem;font-weight:900;color:rgba(200,168,75,.35);letter-spacing:4px}
.setup-start{background:rgba(200,168,75,.18);border:1px solid rgba(200,168,75,.45);color:rgba(200,168,75,.95);
  padding:11px 42px;border-radius:7px;font-size:.95rem;font-weight:700;letter-spacing:4px;
  cursor:pointer;font-family:'Rajdhani',sans-serif;text-transform:uppercase;transition:all .2s}
.setup-start:hover{background:rgba(200,168,75,.3);box-shadow:0 0 36px rgba(200,168,75,.22)}

/* ── LCU status bar ── */
#lcuBar{position:fixed;top:0;left:0;right:0;z-index:800;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:4px 10px;font-size:.72rem;letter-spacing:1px;
  background:rgba(2,4,8,.85);border-bottom:1px solid rgba(255,255,255,.06);
  font-family:'Rajdhani',sans-serif;transition:all .4s;display:none}
#lcuDot{width:7px;height:7px;border-radius:50%;background:#444;flex-shrink:0;transition:background .3s}
#lcuDot.ok{background:#31f2b2;box-shadow:0 0 8px #31f2b2}
#lcuDot.cs{background:#4dafff;box-shadow:0 0 8px #4dafff;animation:dotPulse .8s ease-in-out infinite alternate}
#lcuDot.err{background:#ff4444}
#lcuTxt{color:rgba(148,163,184,.65)}
#modeTag{font-size:.65rem;padding:2px 8px;border-radius:10px;border:1px solid;
  color:rgba(200,168,75,.7);border-color:rgba(200,168,75,.3);background:rgba(200,168,75,.07)}
#modeTag.lcu{color:rgba(49,242,178,.7);border-color:rgba(49,242,178,.3);background:rgba(49,242,178,.07)}

/* ── MAIN UI ── */
#mainUI{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;padding:32px 12px 8px;gap:6px}

/* header */
#header{display:flex;align-items:center;justify-content:center;gap:18px;flex-shrink:0;padding:0 0 4px}
#phaseLbl{font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;
  letter-spacing:4px;color:rgba(200,168,75,.65);text-transform:uppercase;min-width:130px;text-align:center}
#timerWrap{display:flex;flex-direction:column;align-items:center;gap:1px}
#timerVal{font-family:'Rajdhani',sans-serif;font-size:2.6rem;font-weight:900;color:#fff;
  line-height:1;min-width:60px;text-align:center;text-shadow:0 0 28px rgba(200,168,75,.45)}
#timerVal.warn{color:#ff4444;text-shadow:0 0 28px rgba(255,68,68,.65);animation:warnPulse .5s ease-in-out infinite alternate}
#timerBar{width:56px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden}
#timerFill{height:100%;background:rgba(200,168,75,.7);width:100%;transition:width 1s linear}
#turnBadge{font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:700;
  letter-spacing:3px;padding:3px 16px;border-radius:20px;border:1px solid;min-width:130px;text-align:center;transition:all .3s}
#turnBadge.blue{color:#4dafff;border-color:rgba(77,159,255,.4);background:rgba(26,110,240,.1)}
#turnBadge.red{color:#ff6655;border-color:rgba(255,100,80,.4);background:rgba(220,60,40,.1)}

/* ══════════════════════════════
   3D BAN CARDS  ← 핵심 교체
═══════════════════════════════ */
#banRow{display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0;gap:8px;padding:0 4px}
.ban-side{display:flex;gap:5px;align-items:flex-end}
.ban-card{
  width:58px;height:102px; /* portrait = 308:560 loading art ratio */
  position:relative;
  perspective:460px;
  flex-shrink:0;
  cursor:default;
}
.ban-card .bc{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  border-radius:7px;overflow:hidden;
  background:#0c1220;
  border:1.5px solid rgba(148,163,184,.12);
  transition:border-color .4s,box-shadow .4s;
  background-size:cover;
  background-position:center top;
  box-shadow:0 6px 20px rgba(0,0,0,.7);
}
/* empty slot idle */
.ban-card:not(.filled) .bc{
  animation:banIdle 4s ease-in-out infinite;
}
/* filled: floating 3D character */
.ban-card.filled .bc{
  animation:banFloat 3.5s ease-in-out infinite;
}
.ban-card.filled.blue-ban .bc{
  border-color:rgba(77,159,255,.55);
  box-shadow:0 0 18px rgba(77,159,255,.35),0 6px 22px rgba(0,0,0,.75);
}
.ban-card.filled.red-ban .bc{
  border-color:rgba(255,100,80,.55);
  box-shadow:0 0 18px rgba(255,100,80,.35),0 6px 22px rgba(0,0,0,.75);
}
/* active slot */
.ban-card.active .bc{
  border-color:gold !important;
  box-shadow:0 0 16px rgba(255,215,0,.5),0 4px 18px rgba(0,0,0,.7) !important;
  animation:banActive 1.2s ease-in-out infinite !important;
}
/* banned overlay */
.ban-card .xovl{
  position:absolute;inset:0;
  background:rgba(0,0,0,.62);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  opacity:0;transition:opacity .4s;
  border-radius:6px;
}
.ban-card.filled .xovl{opacity:1}
.ban-card .xovl .xi{font-size:1.4rem;color:rgba(220,40,40,.9);line-height:1}
.ban-card .xovl .xn{font-size:.44rem;color:rgba(200,210,230,.55);letter-spacing:.3px;text-align:center;max-width:52px;word-break:keep-all;line-height:1.3}
/* gradient overlay at bottom of card */
.ban-card .bc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:35%;
  background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}

.ban-mid{font-family:'Rajdhani',sans-serif;font-size:.7rem;letter-spacing:2px;
  color:rgba(200,168,75,.35);text-align:center;white-space:nowrap;padding-bottom:6px}

/* ── arena ── */
#arena{flex:1;display:flex;gap:0;min-height:0}
.team-panel{width:150px;flex-shrink:0;display:flex;flex-direction:column;gap:0;padding:0 7px}
.team-hdr{font-family:'Rajdhani',sans-serif;font-size:1.15rem;font-weight:900;
  letter-spacing:3px;text-align:center;padding:3px 0 7px;text-transform:uppercase}
.blue .team-hdr{color:#4dafff;text-shadow:0 0 18px rgba(77,159,255,.4)}
.red .team-hdr{color:#ff6655;text-shadow:0 0 18px rgba(255,100,80,.4)}
.pick-slots{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.pslot{flex:1;border-radius:6px;background:rgba(6,10,22,.7);border:2px solid rgba(148,163,184,.08);
  overflow:hidden;position:relative;perspective:650px;transition:border-color .3s,box-shadow .3s;min-height:0}
.pslot.active{animation:pulseGlow 1s ease-in-out infinite}
.blue .pslot.active{border-color:#4dafff;box-shadow:0 0 16px rgba(77,159,255,.45)}
.red .pslot.active{border-color:#ff6655;box-shadow:0 0 16px rgba(255,100,80,.45)}
.pslot .ci{width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1);position:relative}
.pslot.flipped .ci{transform:rotateY(180deg)}
.pslot .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;overflow:hidden}
.pslot .back{background:linear-gradient(155deg,rgba(12,18,36,.95),rgba(5,8,18,.95))}
.blue .pslot .back::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(26,110,240,.25)}
.red .pslot .back::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:rgba(220,60,40,.25)}
.pslot .front{transform:rotateY(180deg);background:#000}
.pslot .front img{width:100%;height:100%;object-fit:cover;object-position:center 10%}
.pslot .pname{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;
  background:linear-gradient(transparent,rgba(0,0,0,.88));font-size:.58rem;font-weight:700;
  text-align:center;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
/* in-progress pick: highlight */
.pslot.inprogress{border-color:rgba(200,168,75,.6) !important;
  box-shadow:0 0 14px rgba(200,168,75,.3) !important;animation:inprogPulse 1.5s ease-in-out infinite !important}

/* ── center stage ── */
#center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;min-width:0}
#champStage{
  width:220px;height:391px;
  border-radius:12px;
  opacity:0;
  transition:opacity .4s;
  border:2px solid rgba(200,168,75,.25);
  box-shadow:0 28px 70px rgba(0,0,0,.9),0 0 36px rgba(200,168,75,.12);
  display:block;
  image-rendering:auto;
}
#centerHint{font-family:'Rajdhani',sans-serif;font-size:.88rem;letter-spacing:3px;
  color:rgba(148,163,184,.38);text-align:center;text-transform:uppercase}

/* ── operator panel ── */
#opPanel{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(3,6,16,.97);border-top:1px solid rgba(77,159,255,.18);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:56vh;display:flex;flex-direction:column;pointer-events:all}
#opPanel.open{transform:translateY(0)}
#opBar{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
#opSearch{flex:1;background:rgba(12,20,46,.9);border:1px solid rgba(77,159,255,.25);
  color:#fff;padding:6px 11px;border-radius:5px;font-size:.88rem;font-family:'Noto Sans KR',sans-serif;outline:none}
#opSearch::placeholder{color:rgba(148,163,184,.35)}
#opInfo{font-family:'Rajdhani',sans-serif;font-size:.82rem;letter-spacing:1px;color:rgba(200,168,75,.7);min-width:160px}
.obtn{background:rgba(77,159,255,.1);border:1px solid rgba(77,159,255,.28);color:#4dafff;
  padding:5px 11px;border-radius:4px;cursor:pointer;font-size:.75rem;transition:all .15s;white-space:nowrap}
.obtn:hover{background:rgba(77,159,255,.2)}
.obtn.danger{background:rgba(220,60,40,.1);border-color:rgba(220,60,40,.28);color:#ff6655}
#champGrid{flex:1;overflow-y:auto;padding:9px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}
.cgcard{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  padding:4px;border-radius:5px;border:1px solid transparent;transition:all .12s}
.cgcard:hover{background:rgba(77,159,255,.1);border-color:rgba(77,159,255,.28)}
.cgcard.used{opacity:.22;pointer-events:none}
.cgcard img{width:54px;height:54px;border-radius:3px;object-fit:cover}
.cgcard span{font-size:.52rem;color:rgba(185,200,220,.6);text-align:center;line-height:1.2;max-width:66px;word-break:keep-all}
#champGrid::-webkit-scrollbar{width:4px}
#champGrid::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
#champGrid::-webkit-scrollbar-thumb{background:rgba(77,159,255,.22);border-radius:2px}

#opToggle{position:fixed;bottom:7px;right:8px;z-index:300;
  background:rgba(77,159,255,.13);border:1px solid rgba(77,159,255,.3);
  color:#4dafff;padding:5px 9px;border-radius:4px;cursor:pointer;
  font-size:.72rem;display:none;pointer-events:all;transition:all .2s}
#opToggle:hover{background:rgba(77,159,255,.25)}

/* ── animations ── */
@keyframes banIdle{
  0%,100%{transform:rotateX(4deg) rotateY(-2deg)}
  50%{transform:rotateX(6deg) rotateY(2deg)}
}
@keyframes banFloat{
  0%,100%{transform:rotateX(6deg) rotateY(-5deg) translateY(0)}
  33%{transform:rotateX(9deg) rotateY(5deg) translateY(-5px)}
  66%{transform:rotateX(4deg) rotateY(-3deg) translateY(-2px)}
}
@keyframes banActive{
  0%,100%{transform:rotateX(5deg) rotateY(-3deg) scale(1)}
  50%{transform:rotateX(8deg) rotateY(3deg) scale(1.04)}
}
@keyframes pulseGlow{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes inprogPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes warnPulse{from{opacity:1}to{opacity:.35}}
@keyframes dotPulse{from{opacity:1}to{opacity:.25}}

/* phase flash */
#phaseFlash{position:fixed;inset:0;z-index:400;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0}
#phaseFlashTxt{font-family:'Rajdhani',sans-serif;font-size:3.5rem;font-weight:900;
  letter-spacing:10px;text-transform:uppercase;text-align:center;
  background:linear-gradient(135deg,#fff,rgba(200,168,75,.9));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#completeBanner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  z-index:450;text-align:center;pointer-events:none}
#completeBanner h1{font-family:'Rajdhani',sans-serif;font-size:3.5rem;font-weight:900;
  letter-spacing:8px;color:rgba(200,168,75,.95);text-shadow:0 0 50px rgba(200,168,75,.35)}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- LCU status bar -->
<div id="lcuBar">
  <div id="lcuDot"></div>
  <span id="lcuTxt">롤 클라이언트 연결 대기 중...</span>
  <div id="modeTag">수동 모드</div>
</div>

<!-- Load screen -->
<div id="loadScreen" class="screen">
  <div class="logo">BANPICK 3D</div>
  <div class="sub-logo">LEAGUE OF LEGENDS DRAFT SHOW</div>
  <div class="load-bar-wrap"><div class="load-bar" id="loadBar"></div></div>
  <div class="load-status" id="loadStatus">챔피언 데이터 로딩 중...</div>
</div>

<!-- Setup screen -->
<div id="setupScreen" class="screen">
  <div class="logo">BANPICK 3D</div>
  <div class="setup-teams">
    <div class="setup-team st-blue">
      <label>BLUE TEAM</label>
      <input id="blueName" value="BLUE TEAM" maxlength="20" autocomplete="off">
    </div>
    <div class="setup-vs">VS</div>
    <div class="setup-team st-red">
      <label>RED TEAM</label>
      <input id="redName" value="RED TEAM" maxlength="20" autocomplete="off">
    </div>
  </div>
  <button class="setup-start" id="startBtn">▶ 밴픽 시작</button>
</div>

<!-- Main UI -->
<div id="mainUI">
  <div id="header">
    <div id="phaseLbl">대기 중</div>
    <div id="timerWrap">
      <div id="timerVal">--</div>
      <div id="timerBar"><div id="timerFill"></div></div>
    </div>
    <div id="turnBadge" class="blue">--</div>
  </div>

  <!-- 3D Ban cards row -->
  <div id="banRow">
    <div class="ban-side" id="blueBans"></div>
    <div class="ban-mid" id="banMid">BAN PHASE</div>
    <div class="ban-side" id="redBans"></div>
  </div>

  <div id="arena">
    <div class="team-panel blue">
      <div class="team-hdr" id="blueHdr">BLUE</div>
      <div class="pick-slots" id="bluePicks"></div>
    </div>
    <div id="center">
      <canvas id="champStage" width="220" height="391"></canvas>
      <div id="centerHint">챔피언을 선택하세요</div>
    </div>
    <div class="team-panel red">
      <div class="team-hdr" id="redHdr">RED</div>
      <div class="pick-slots" id="redPicks"></div>
    </div>
  </div>
</div>

<div id="phaseFlash"><div id="phaseFlashTxt"></div></div>
<div id="completeBanner"><h1>DRAFT COMPLETE</h1></div>

<button id="opToggle">⚙ 운영자 [TAB]</button>

<div id="opPanel">
  <div id="opBar">
    <input id="opSearch" placeholder="🔍 챔피언 검색..." autocomplete="off">
    <div id="opInfo">대기 중</div>
    <button class="obtn" id="undoBtn">↩ 되돌리기</button>
    <button class="obtn danger" id="resetBtn">⟳ 초기화</button>
  </div>
  <div id="champGrid"></div>
</div>

<script>
// ════════════════════════════════════════════════
//  THREE.JS  — 3D 배경 씬
// ════════════════════════════════════════════════
let renderer, scene, camera, particles, clock;
let mx=0, my=0;

function initThree(){
  const cv=document.getElementById('bgCanvas');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x020408);
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x020408,.007);
  clock=new THREE.Clock();
  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);
  camera.position.set(0,0,60);

  // 파티클
  const N=2000, pos=new Float32Array(N*3), col=new Float32Array(N*3), sz=new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-.5)*220; pos[i*3+1]=(Math.random()-.5)*120; pos[i*3+2]=(Math.random()-.5)*110;
    const b=Math.random()>.42;
    if(b){col[i*3]=.06;col[i*3+1]=.32+Math.random()*.28;col[i*3+2]=.65+Math.random()*.35;}
    else{col[i*3]=.6+Math.random()*.4;col[i*3+1]=.06;col[i*3+2]=.04;}
    sz[i]=Math.random()*1.3+.2;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.PointsMaterial({size:.65,vertexColors:true,transparent:true,opacity:.5,sizeAttenuation:true,depthWrite:false});
  particles=new THREE.Points(geo,mat);
  scene.add(particles);

  // 바닥 그리드
  const g=new THREE.GridHelper(220,26,0x0a1530,0x060c1a);
  g.position.y=-30; scene.add(g);

  // 수직 빛 기둥
  const bGeo=new THREE.PlaneGeometry(1,75);
  [-38,-20,0,20,38].forEach((x,i)=>{
    const m=new THREE.MeshBasicMaterial({color:i%2===0?0x1a6ef0:0xd02818,transparent:true,opacity:.03+Math.random()*.04,side:THREE.DoubleSide,depthWrite:false});
    const b=new THREE.Mesh(bGeo,m);
    b.position.set(x,5,-28+Math.random()*10); b.rotation.z=(Math.random()-.5)*.2;
    scene.add(b);
  });

  // 부유하는 구체 (팀 컬러)
  const sGeo=new THREE.SphereGeometry(1,10,10);
  [[-42,2,-12],[42,2,-12],[-26,14,-18],[26,14,-18],[0,-14,-8]].forEach(([x,y,z])=>{
    const m=new THREE.MeshBasicMaterial({color:x<0?0x1a3870:0x701018,transparent:true,opacity:.15+Math.random()*.1});
    const o=new THREE.Mesh(sGeo,m); o.position.set(x,y,z);
    o.userData={oy:y,spd:.35+Math.random()*.4}; scene.add(o);
  });

  window.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;});
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

function renderThree(){
  requestAnimationFrame(renderThree);
  const t=clock.getElapsedTime();
  particles.rotation.y=t*.022; particles.rotation.x=Math.sin(t*.016)*.035;
  scene.children.forEach(o=>{if(o.userData.oy!==undefined) o.position.y=o.userData.oy+Math.sin(t*o.userData.spd+o.position.x)*2.5;});
  camera.position.x+=(mx*4-camera.position.x)*.022; camera.position.y+=(-my*2.5-camera.position.y)*.022;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

// ════════════════════════════════════════════════
//  파티클 버스트 (밴/픽 이벤트용)
// ════════════════════════════════════════════════
function burstParticles(team){
  const N=80;
  const pos=new Float32Array(N*3), col=new Float32Array(N*3), sz=new Float32Array(N);
  const cx=team==='blue'?-35:35;
  for(let i=0;i<N;i++){
    pos[i*3]=cx+(Math.random()-.5)*8; pos[i*3+1]=(Math.random()-.5)*6; pos[i*3+2]=(Math.random()-.5)*8;
    if(team==='blue'){col[i*3]=.1;col[i*3+1]=.5+Math.random()*.5;col[i*3+2]=1;}
    else{col[i*3]=1;col[i*3+1]=.2+Math.random()*.2;col[i*3+2]=.1;}
    sz[i]=Math.random()*2+.5;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.PointsMaterial({size:1.2,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:true,depthWrite:false});
  const burst=new THREE.Points(geo,mat); scene.add(burst);
  let age=0;
  const tick=()=>{
    age+=.04; mat.opacity=Math.max(0,.9-age*1.2);
    burst.position.y+=.05;
    if(age>0.75){scene.remove(burst);return;}
    requestAnimationFrame(tick);
  }; tick();
}

let champById={};  // numericId → {id,name}
let champByKey={}; // 'Aatrox' → {id,name,numId}
let DDV='14.10.1';

  setLoad(35,`챔피언 로딩 중... (${DDV})`);
  const r=await fetch(`https://ddragon.leagueoflegends.com/cdn/${DDV}/data/ko_KR/champion.json`);
  const j=await r.json();

function setLoad(p,msg){document.getElementById('loadBar').style.width=p+'%';document.getElementById('loadStatus').textContent=msg;}

// ════════════════════════════════════════════════
//  DRAFT STATE  (수동 모드용)
// ════════════════════════════════════════════════
const SEQ=[
  ['blue','ban',0,'BAN PHASE 1'],['red','ban',0,'BAN PHASE 1'],
  ['blue','ban',1,'BAN PHASE 1'],['red','ban',1,'BAN PHASE 1'],
  ['blue','ban',2,'BAN PHASE 1'],['red','ban',2,'BAN PHASE 1'],
  ['blue','pick',0,'PICK PHASE 1'],
  ['red','pick',0,'PICK PHASE 1'],['red','pick',1,'PICK PHASE 1'],
  ['blue','pick',1,'PICK PHASE 1'],['blue','pick',2,'PICK PHASE 1'],
  ['red','pick',2,'PICK PHASE 1'],
  ['red','ban',3,'BAN PHASE 2'],['blue','ban',3,'BAN PHASE 2'],
  ['red','ban',4,'BAN PHASE 2'],['blue','ban',4,'BAN PHASE 2'],
  ['red','pick',3,'PICK PHASE 2'],
  ['blue','pick',3,'PICK PHASE 2'],['blue','pick',4,'PICK PHASE 2'],
  ['red','pick',4,'PICK PHASE 2'],
];

let S={};
function newState(bn,rn){
  return{step:0,done:false,
    blue:{name:bn,bans:Array(5).fill(null),picks:Array(5).fill(null)},
    red:{name:rn,bans:Array(5).fill(null),picks:Array(5).fill(null)},
    used:new Set()};
}

function buildSlots(){
  // 3D ban cards
  ['blue','red'].forEach(t=>{
    const el=document.getElementById(t+'Bans');
    el.innerHTML='';
    for(let i=0;i<5;i++){

    el.innerHTML='';
    for(let i=0;i<5;i++){

      d.className='pslot';
      d.id=`ps-${t}-${i}`;
      d.innerHTML=`<div class="ci"><div class="face back"></div><div class="face front"><img src="" alt=""><div class="pname"></div></div></div>`;

// ════════════════════════════════════════════════
//  UI 업데이트  (수동 모드)
// ════════════════════════════════════════════════
let lastPhase='';

function updateUI(){
  if(S.done) return;
  const[team,type,idx,phase]=SEQ[S.step];
  if(phase!==lastPhase){lastPhase=phase;flashPhase(phase);}
  document.getElementById('phaseLbl').textContent=phase;
  const b=document.getElementById('turnBadge');
  b.textContent=`${team==='blue'?'🔵 BLUE':'🔴 RED'} — ${type==='ban'?'밴':'픽'}`;
  b.className=team;
  document.querySelectorAll('.ban-card,.pslot').forEach(el=>el.classList.remove('active'));
  const ae=document.getElementById(type==='ban'?`bc-${team}-${idx}`:`ps-${team}-${idx}`);
  if(ae) ae.classList.add('active');
  ['blue','red'].forEach(t=>S[t].bans.forEach((k,i)=>{if(!k)return;const el=document.getElementById(`bc-${t}-${i}`);if(!el||el.classList.contains('filled'))return;fillBanSlot(el,k,t);}));
  document.getElementById('centerHint').textContent=`${team==='blue'?'🔵 BLUE':'🔴 RED'} ${type==='ban'?'밴':'픽'} 선택`;
  document.getElementById('opInfo').textContent=`${team==='blue'?'블루':'레드'} ${type==='ban'?'밴':'픽'} (${S.step+1}/${SEQ.length})`;
  updateGrid();
}

function fillBanSlot(el, key, team){
  const ch=champByKey[key]||{name:key};
  el.classList.add('filled',`${team}-ban`);
  el.classList.remove('active');
  const bc=el.querySelector('.bc');
  bc.style.backgroundImage=`url('${loadingUrl(key)}')`;
  const xn=el.querySelector('.xn');
  if(xn) xn.textContent=ch.name;
}

function fillPickSlot(key, team, idx){
  const el=document.getElementById(`ps-${team}-${idx}`);
  if(!el) return;
  const fr=el.querySelector('.front');
  if(!fr) return;
  fr.querySelector('img').src=splashUrl(key);
  fr.querySelector('.pname').textContent=champByKey[key]?.name||key;
  el.classList.remove('active','inprogress');
  requestAnimationFrame(()=>el.classList.add('flipped'));
}

function updateGrid(){
  const q=document.getElementById('opSearch').value.toLowerCase().trim();
  const grid=document.getElementById('champGrid');
  grid.innerHTML='';
  Object.values(champByKey).sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach(({id,name})=>{
    if(q&&!name.toLowerCase().includes(q)&&!id.toLowerCase().includes(q)) return;
    const d=document.createElement('div');
    d.className='cgcard'+(S.used.has(id)?' used':'');
    d.innerHTML=`<img src="${iconUrl(id)}" alt="${name}" loading="lazy"><span>${name}</span>`;
    d.onclick=()=>pick(id);
    grid.appendChild(d);
  });
}
function updateNames(){
  document.getElementById('blueHdr').textContent=S.blue.name;
  document.getElementById('redHdr').textContent=S.red.name;
}

// ════════════════════════════════════════════════
//  픽/밴 (수동 모드)
// ════════════════════════════════════════════════
let animBusy=false;

function pick(key){
  if(S.done||animBusy||S.used.has(key)||lcuMode) return;
  const[team,type,idx]=SEQ[S.step];
  S[team][type+'s'][idx]=key; S.used.add(key);
  stopTimer(); animBusy=true;

  if(type==='ban'){
    const el=document.getElementById(`bc-${team}-${idx}`);
    if(el) fillBanSlot(el,key,team);
    burstParticles(team);
    setTimeout(()=>{animBusy=false;S.step++;if(S.step>=SEQ.length){S.done=true;onComplete();}else{updateUI();startTimer();}},400);
  } else {
    revealChamp(key,team,type,idx,()=>{
      animBusy=false;S.step++;
      if(S.step>=SEQ.length){S.done=true;onComplete();}else{updateUI();startTimer();}
    });
  }
  updateUI();
}

// ════════════════════════════════════════════════
//  THREE.JS 챔피언 스테이지 (3D 모델 대체)
// ════════════════════════════════════════════════
let champR=null,champSc=null,champCam=null,champMesh=null,champTL=null,champLooping=false;

function initChampStage(){
  if(champR) return;
  const cv=document.getElementById('champStage');
  champR=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  champR.setSize(220,391,false);
  champR.setPixelRatio(Math.min(devicePixelRatio,2));
  champR.setClearColor(0x000000,0);

  champSc=new THREE.Scene();
  champCam=new THREE.PerspectiveCamera(42,220/391,0.1,50);
  champCam.position.z=3.2;

  champSc.add(new THREE.AmbientLight(0x334466,0.5));
  champTL=new THREE.PointLight(0x4d9fff,5,18);
  champTL.position.set(-1.5,2,3);
  champSc.add(champTL);
  const rimL=new THREE.PointLight(0x112244,2,12);
  rimL.position.set(1.5,-1.5,-3);
  champSc.add(rimL);

  const geo=new THREE.PlaneGeometry(1.8,3.2);
  const mat=new THREE.MeshPhongMaterial({transparent:true,opacity:0,shininess:80});
  champMesh=new THREE.Mesh(geo,mat);
  champSc.add(champMesh);

  if(!champLooping){
    champLooping=true;
    (function loop(){
      requestAnimationFrame(loop);
      const t=Date.now()*.001;
      champMesh.rotation.y=Math.sin(t*.38)*.22;
      champMesh.rotation.x=Math.sin(t*.29)*.07;
      champMesh.position.y=Math.sin(t*.47)*.09;
      champTL.intensity=5+Math.sin(t*1.6)*.8;
      champR.render(champSc,champCam);
    })();
  }
}

function revealChamp(key,team,type,idx,cb){
  if(!champR) initChampStage();
  const cv=document.getElementById('champStage');
  const hint=document.getElementById('centerHint');
  champTL.color.setHex(team==='blue'?0x4d9fff:0xff6655);

  const loader=new THREE.TextureLoader();
  loader.load(loadingUrl(key),(tex)=>{
    champMesh.material.map=tex;
    champMesh.material.opacity=0;
    champMesh.material.needsUpdate=true;
    champMesh.rotation.set(0.2,team==='blue'?-0.3:0.3,0);
    champMesh.position.set(0,-0.4,0);

    cv.style.opacity='1';
    gsap.set(hint,{opacity:0});
    burstParticles(team);

    gsap.to(champMesh.material,{opacity:1,duration:.5,ease:'power2.out'});
    gsap.to(champMesh.rotation,{x:0,y:0,duration:.6,ease:'power2.out'});
    gsap.to(champMesh.position,{y:0,duration:.5,ease:'power2.out'});

    setTimeout(()=>{
      fillPickSlot(key,team,idx);
      gsap.to(champMesh.material,{opacity:0,duration:.3,delay:.35,
        onComplete:()=>{
          cv.style.opacity='0';
          gsap.to(hint,{opacity:1,duration:.2});
          cb();
        }
      });
    },1600);
  },undefined,()=>cb());
}

// ════════════════════════════════════════════════
//  LCU 연동  ← 핵심 신규 기능
// ════════════════════════════════════════════════
let lcuMode=false;
let ws=null;
let lcuLastSig='';

function connectWS(){
  try{
    ws=new WebSocket(`ws://${location.hostname}:3000`);
    ws.onopen=()=>{
      setLcuStatus('ok','롤 클라이언트 연결됨');
    };
    ws.onmessage=e=>{
      let msg;try{msg=JSON.parse(e.data);}catch(_){return;}
      if(msg.type==='lcu_champ_select') handleLcuData(msg.data);
      if(msg.type==='state'&&msg.data?.lcuDraft) handleLcuData(msg.data.lcuDraft);
    };
    ws.onclose=()=>{
      setLcuStatus('err','서버 연결 끊김 — 재연결 중...');
      setTimeout(connectWS,2500);
    };
    ws.onerror=()=>{};
  }catch(_){setTimeout(connectWS,3000);}
}

function setLcuStatus(type,txt){
  const dot=document.getElementById('lcuDot');
  const label=document.getElementById('lcuTxt');
  const tag=document.getElementById('modeTag');
  dot.className=type;
  label.textContent=txt;
  if(type==='cs'){tag.textContent='LCU 모드';tag.className='lcu';}
  else{tag.textContent='수동 모드';tag.className='';}
}

function handleLcuData(data){
  if(!data) return;
  if(!data.connected){
    setLcuStatus('err','롤 클라이언트 감지 안됨');
    if(lcuMode){lcuMode=false;document.getElementById('opToggle').style.display='block';}
    return;
  }
  if(!data.inChampSelect||!data.session){
    setLcuStatus('ok','클라이언트 대기 중');
    if(lcuMode){lcuMode=false;document.getElementById('opToggle').style.display='block';}
    return;
  }

  // 챔선 진행 중
  const sig=JSON.stringify(data.session);
  if(sig===lcuLastSig) return;
  lcuLastSig=sig;

  if(!lcuMode){
    lcuMode=true;
    toggleOp(false);
    document.getElementById('opToggle').style.display='none';
  }
  setLcuStatus('cs','챔피언 선택 진행 중');

  applyLcuSession(data.session);
}

function applyLcuSession(session){
  if(!session) return;
  const actions=session.actions||[];

  // 완료된 밴
  const blueBans=actions.filter(a=>a.type==='ban'&&a.side==='blue'&&a.completed&&a.championId).sort((a,b)=>a.id-b.id);
  const redBans =actions.filter(a=>a.type==='ban'&&a.side==='red' &&a.completed&&a.championId).sort((a,b)=>a.id-b.id);

  blueBans.forEach((a,i)=>{
    const ch=champById[a.championId]; if(!ch) return;
    const el=document.getElementById(`bc-blue-${i}`);
    if(el&&!el.classList.contains('filled')){fillBanSlot(el,ch.id,'blue');burstParticles('blue');}
  });
  redBans.forEach((a,i)=>{
    const ch=champById[a.championId]; if(!ch) return;
    const el=document.getElementById(`bc-red-${i}`);
    if(el&&!el.classList.contains('filled')){fillBanSlot(el,ch.id,'red');burstParticles('red');}
  });

  // 완료된 픽
  actions.filter(a=>a.type==='pick'&&a.completed&&a.championId).forEach(a=>{
    const ch=champById[a.championId]; if(!ch) return;
    const el=document.getElementById(`ps-${a.side}-${a.idx}`);
    if(el&&!el.classList.contains('flipped')){
      revealChamp(ch.id,a.side,'pick',a.idx,()=>{});
    }
  });

  // 진행 중 액션 하이라이트
  document.querySelectorAll('.ban-card,.pslot').forEach(el=>el.classList.remove('active','inprogress'));
  const inprog=actions.find(a=>a.inProgress&&a.championId===0);
  if(inprog){
    if(inprog.type==='ban'){
      const banIdx=inprog.side==='blue'?blueBans.length:redBans.length;
      const el=document.getElementById(`bc-${inprog.side}-${banIdx}`);
      if(el) el.classList.add('active');
    } else {
      const el=document.getElementById(`ps-${inprog.side}-${inprog.idx}`);
      if(el) el.classList.add('inprogress');
    }
  }

  // 타이머
  if(session.timer){
    const rem=Math.max(0,Math.round((session.timer.timeLeftInPhase||0)/1000));
    const tv=document.getElementById('timerVal');
    tv.textContent=rem;
    tv.classList.toggle('warn',rem<=10);
    document.getElementById('timerFill').style.transition='none';
    document.getElementById('timerFill').style.width=((rem/30)*100)+'%';
  }

  // 페이즈 레이블
  const totalBans=blueBans.length+redBans.length;
  const totalPicks=actions.filter(a=>a.type==='pick'&&a.completed&&a.championId).length;
  const phase=totalBans<6?'BAN PHASE 1':totalPicks<6?'PICK PHASE 1':totalBans<10?'BAN PHASE 2':'PICK PHASE 2';
  document.getElementById('phaseLbl').textContent=phase;

  // 차례 표시
  if(inprog){
    const b=document.getElementById('turnBadge');
    b.className=inprog.side;
    b.textContent=`${inprog.side==='blue'?'🔵 BLUE':'🔴 RED'} — ${inprog.type==='ban'?'밴':'픽'}`;
  }
}

// ════════════════════════════════════════════════
//  타이머 (수동 모드)
// ════════════════════════════════════════════════
let timerID=null, timerSec=30; const TL=30;

function startTimer(){
  if(lcuMode) return;
  timerSec=TL;
  const el=document.getElementById('timerVal'),fill=document.getElementById('timerFill');
  el.classList.remove('warn'); el.textContent=timerSec;
  fill.style.transition='none'; fill.style.width='100%';
  clearInterval(timerID);
  timerID=setInterval(()=>{
    timerSec--;
    el.textContent=timerSec;
    fill.style.transition='width 1s linear'; fill.style.width=(timerSec/TL*100)+'%';
    if(timerSec<=10) el.classList.add('warn');
    if(timerSec<=0) stopTimer();
  },1000);
}
function stopTimer(){
  clearInterval(timerID);
  if(!lcuMode){document.getElementById('timerVal').textContent='--';document.getElementById('timerVal').classList.remove('warn');document.getElementById('timerFill').style.width='0%';}
}

// ════════════════════════════════════════════════
//  기타
// ════════════════════════════════════════════════
function flashPhase(p){
  const fl=document.getElementById('phaseFlash'),t=document.getElementById('phaseFlashTxt');
  t.textContent=p;
  gsap.fromTo(fl,{opacity:0,scale:.82},{opacity:1,scale:1,duration:.28,ease:'power2.out',
    onComplete:()=>gsap.to(fl,{opacity:0,duration:.5,delay:.55})});
}
function onComplete(){
  document.getElementById('phaseLbl').textContent='DRAFT COMPLETE';
  document.getElementById('centerHint').textContent='밴픽 완료';
  document.getElementById('turnBadge').textContent='';
  document.querySelectorAll('.ban-card,.pslot').forEach(el=>el.classList.remove('active','inprogress'));
  const banner=document.getElementById('completeBanner');
  gsap.to(banner,{scale:1,duration:.6,ease:'back.out(1.5)',delay:.3});
  setTimeout(()=>gsap.to(banner,{scale:0,duration:.4,delay:3}),3000);
}
function undo(){
  if(S.step===0||animBusy||lcuMode) return;
  S.step--;
  const[team,type,idx]=SEQ[S.step];
  const key=S[team][type+'s'][idx];
  if(key){
    S.used.delete(key); S[team][type+'s'][idx]=null;
    if(type==='ban'){const el=document.getElementById(`bc-${team}-${idx}`);if(el){el.querySelector('.bc').style.backgroundImage='';el.className='ban-card';}}
    else{const el=document.getElementById(`ps-${team}-${idx}`);if(el){el.classList.remove('flipped','active','inprogress');const fr=el.querySelector('.front');if(fr){fr.querySelector('img').src='';fr.querySelector('.pname').textContent='';}}
    }
  }
  S.done=false; lastPhase='';
  if(champMesh){champMesh.material.opacity=0;document.getElementById('champStage').style.opacity='0';}
  startTimer(); updateUI();
}
function reset(){
  if(!confirm('밴픽을 처음부터 다시 시작할까요?')) return;
  stopTimer(); animBusy=false; lastPhase=''; lcuLastSig='';
  S=newState(S.blue.name,S.red.name);
  buildSlots(); updateNames();
  if(champMesh){champMesh.material.opacity=0;document.getElementById('champStage').style.opacity='0';}
  document.getElementById('centerHint').textContent='챔피언을 선택하세요';
  gsap.set(document.getElementById('completeBanner'),{scale:0});
  updateUI(); startTimer();
}

let opOpen=false;
function toggleOp(f){opOpen=f!==undefined?f:!opOpen;document.getElementById('opPanel').classList.toggle('open',opOpen);if(opOpen)updateGrid();}
document.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();toggleOp();}if(e.key==='Escape')toggleOp(false);});

    document.getElementById('opToggle').style.display='block';
    S=newState(bn,rn);
    buildSlots(); updateNames(); lastPhase='';
    updateUI(); startTimer();
    connectWS();
    initChampStage();
  };

  document.getElementById('opToggle').onclick=toggleOp;
  document.getElementById('undoBtn').onclick=undo;
  document.getElementById('resetBtn').onclick=reset;
  document.getElementById('opSearch').oninput=updateGrid;
})();
