<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Davido Inhouse Draft Show</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#58b4ff;--red:#ff4d6a;--gold:#f5d97e;--bg:#03050f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:#f0f6ff;font-family:'Rajdhani','Pretendard','Noto Sans KR',sans-serif}

/* BG */
#particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 55% at 20% 50%,rgba(88,180,255,.16),transparent 70%),
    radial-gradient(ellipse 60% 55% at 80% 50%,rgba(255,77,106,.14),transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 50%,rgba(245,217,126,.09),transparent 60%),
    linear-gradient(180deg,#040818,#060c1e 50%,#040818)}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(88,180,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(88,180,255,.035) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
.bg-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 110% 110% at 50% 50%,transparent 45%,rgba(3,5,15,.9) 100%)}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 3px)}

/* CORNERS */
.corner{position:fixed;z-index:4;width:32px;height:32px;pointer-events:none}
.corner::before,.corner::after{content:'';position:absolute;background:var(--gold);opacity:.7}
.corner::before{width:100%;height:2px}.corner::after{width:2px;height:100%}
.corner.tl{top:16px;left:16px}.corner.tl::before,.corner.tl::after{top:0;left:0}
.corner.tr{top:16px;right:16px}.corner.tr::before{top:0;right:0}.corner.tr::after{top:0;right:0}
.corner.bl{bottom:16px;left:16px}.corner.bl::before{bottom:0;left:0}.corner.bl::after{bottom:0;left:0}
.corner.br{bottom:16px;right:16px}.corner.br::before{bottom:0;right:0}.corner.br::after{bottom:0;right:0}

/* ENERGY LINES */
.eline{position:fixed;height:2px;border-radius:999px;z-index:4;opacity:.5;pointer-events:none;
  filter:drop-shadow(0 0 8px currentColor)}
.eline.blue{top:84px;left:30px;width:28vw;color:var(--blue);
  background:linear-gradient(90deg,transparent,var(--blue),transparent)}
.eline.red{top:84px;right:30px;width:28vw;color:var(--red);
  background:linear-gradient(270deg,transparent,var(--red),transparent)}
.eline.pulse{animation:ePulse .6s ease}
@keyframes ePulse{0%{opacity:.1;transform:scaleX(.3)}40%{opacity:1}100%{opacity:.5;transform:scaleX(1)}}

/* SWEEP */
.sweep{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  transform:translateX(-120%)}
.sweep.on{animation:sweepAnim .75s ease}
@keyframes sweepAnim{0%{opacity:0;transform:translateX(-120%)}15%{opacity:.8}100%{opacity:0;transform:translateX(120%)}}

/* ARENA */
.arena{position:relative;z-index:2;width:100vw;height:100vh;min-width:1080px;min-height:580px;
  display:grid;grid-template-rows:auto 1fr auto;padding:18px 30px 16px;gap:12px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 540px 1fr;align-items:center;gap:16px;position:relative;z-index:5}
.side-title{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:3px}
.side-title.right{justify-content:flex-end}
.side-title.blue{color:var(--blue)}.side-title.red{color:var(--red)}
.side-orb{width:13px;height:13px;border-radius:50%;flex-shrink:0;animation:orbPulse 2.2s ease-in-out infinite}
.blue .side-orb{background:var(--blue);box-shadow:0 0 14px var(--blue),0 0 28px rgba(88,180,255,.35)}
.red .side-orb{background:var(--red);box-shadow:0 0 14px var(--red),0 0 28px rgba(255,77,106,.35)}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35);opacity:.7}}
.brand{text-align:center;position:relative;padding:12px 0}
.brand-eyebrow{font-size:11px;font-weight:700;letter-spacing:6px;color:var(--gold)}
.brand-title{font-size:30px;font-weight:700;letter-spacing:3px;line-height:1;
  background:linear-gradient(135deg,#fff 20%,var(--gold) 50%,#fff 80%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(245,217,126,.3))}
.brand-line{width:180px;height:1px;margin:6px auto;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.brand-sub{font-size:11px;font-weight:700;letter-spacing:4px;color:#7a92b0}

/* MAIN */
.main{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;align-items:stretch;min-height:0}

/* CARDS */
.team-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;min-height:0}
.champ-card{position:relative;min-width:0;overflow:hidden;border-radius:18px;
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);
  transform:skewX(-3deg);opacity:.3;isolation:isolate;
  transition:opacity .5s,box-shadow .5s}
.red-strip .champ-card{transform:skewX(3deg)}
.champ-card .splash{position:absolute;inset:-6%;
  background-image:var(--splash);background-size:cover;background-position:var(--face-pos,50% 15%);
  opacity:.14;
  filter:saturate(.45) grayscale(.3);transition:opacity .7s,filter .7s,transform .7s}
.champ-card.revealed .splash{opacity:1;filter:saturate(1.1) contrast(1.04)}
.champ-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.2) 38%,rgba(0,0,0,.82));z-index:1}
.champ-card::before{content:'';position:absolute;inset:0;border-radius:18px;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s}
.blue-strip .champ-card.revealed::before{box-shadow:inset 0 0 0 1px rgba(88,180,255,.55),0 0 28px rgba(88,180,255,.12);opacity:1}
.red-strip .champ-card.revealed::before{box-shadow:inset 0 0 0 1px rgba(255,77,106,.55),0 0 28px rgba(255,77,106,.12);opacity:1}
.champ-card.revealed{opacity:1;animation:none}
.red-strip .champ-card.revealed{animation:none}
@keyframes cardReveal{0%{transform:skewX(-3deg) translateY(26px) scale(.87);filter:blur(8px) brightness(1.7)}55%{filter:blur(0) brightness(1.1)}100%{transform:skewX(-3deg) translateY(0) scale(1);filter:blur(0)}}
@keyframes cardRevealR{0%{transform:skewX(3deg) translateY(26px) scale(.87);filter:blur(8px) brightness(1.7)}55%{filter:blur(0) brightness(1.1)}100%{transform:skewX(3deg) translateY(0) scale(1);filter:blur(0)}}
.lane-badge{position:absolute;top:10px;left:10px;z-index:3;width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;background:rgba(4,8,18,.75);border:1px solid rgba(255,255,255,.13);
  font-size:11px;font-weight:700;color:#ccdaef;backdrop-filter:blur(8px)}
.card-info{position:absolute;left:12px;right:12px;bottom:12px;z-index:3}
.card-player{font-size:14px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;word-break:break-word;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.card-champ{margin-top:3px;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.champ-card:not(.revealed) .card-player{color:#4d5e72}
.champ-card:not(.revealed) .card-champ{color:#3a4c60}
.blue-strip .lane-badge{display:none}

/* CENTER */
.center-core{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.vs-ring{position:relative;width:120px;height:120px;display:grid;place-items:center;flex-shrink:0}
.vs-ring-svg{position:absolute;inset:0;animation:ringRot 8s linear infinite}
@keyframes ringRot{to{transform:rotate(360deg)}}
.vs-inner{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(245,217,126,.14),rgba(6,10,22,.92) 70%);
  border:1px solid rgba(245,217,126,.22);box-shadow:0 0 26px rgba(245,217,126,.1),inset 0 0 18px rgba(245,217,126,.05)}
.vs-text{font-size:34px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 10px rgba(245,217,126,.4))}
.phase-box{text-align:center;background:rgba(4,8,18,.68);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:12px 16px;backdrop-filter:blur(12px);width:100%}
.phase-lbl{font-size:10px;font-weight:700;letter-spacing:4px;color:var(--gold);margin-bottom:5px}
.phase-name{font-size:16px;font-weight:700;line-height:1.2}
.phase-timer{margin-top:7px;font-size:24px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}

/* BANS */
.lower{display:grid;grid-template-columns:1fr 136px 1fr;gap:16px;align-items:stretch;position:relative;z-index:3}
.ban-panel{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px;
  background:rgba(4,8,18,.56);border:1px solid rgba(255,255,255,.07);border-radius:16px;backdrop-filter:blur(14px)}
.ban-slot{position:relative;border-radius:11px;overflow:hidden;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.04);aspect-ratio:3/4;
  opacity:.22;filter:grayscale(1) brightness(.45);transform:scale(.9);
  transition:opacity .4s,filter .4s,transform .4s,border-color .4s}
.ban-slot::before{content:'';position:absolute;inset:-8%;background-image:var(--splash);background-size:cover;background-position:center 15%;opacity:.5;filter:grayscale(.3)}
.ban-slot::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85))}
.ban-slot.revealed{opacity:1;filter:grayscale(.18) brightness(.75) saturate(1.1);transform:scale(1);
  border-color:rgba(255,60,80,.35);animation:none}
@keyframes banReveal{0%{transform:scale(.75) translateY(-10px);filter:grayscale(1) brightness(1.5)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.ban-slash{position:absolute;left:-20%;right:-20%;top:48%;height:2px;z-index:2;
  background:linear-gradient(90deg,transparent,#ff3050 20%,#ff3050 80%,transparent);
  box-shadow:0 0 10px #ff3050,0 0 22px rgba(255,48,80,.4);
  transform:rotate(-26deg) scaleX(0);transition:transform .3s ease .18s}
.ban-slot.revealed .ban-slash{transform:rotate(-26deg) scaleX(1)}
.ban-name{position:absolute;left:3px;right:3px;bottom:4px;z-index:3;text-align:center;
  font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lower-center{display:flex;align-items:center;justify-content:center}

/* TOAST */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:8;padding:8px 18px;
  border-radius:999px;background:rgba(4,8,18,.82);border:1px solid rgba(255,255,255,.11);
  color:#c0d0e8;font-size:12px;font-weight:700;letter-spacing:1px;backdrop-filter:blur(14px);white-space:nowrap}

/* AUDIO */
#audioUnlock{position:fixed;bottom:18px;right:18px;z-index:10;cursor:pointer;padding:8px 16px;
  border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(4,8,18,.82);
  backdrop-filter:blur(10px);color:#dbe8ff;font-size:12px;font-weight:700;letter-spacing:1px;transition:opacity .4s}
#audioUnlock:hover{background:rgba(88,180,255,.18)}
#audioUnlock.hidden{opacity:0;pointer-events:none}
.sound-control{position:fixed;left:54px;bottom:18px;z-index:10;display:flex;align-items:center;gap:9px;
  width:236px;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
  background:rgba(4,8,18,.82);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.22);
  opacity:0;transition:opacity .22s ease,transform .22s ease,background .22s ease}
.sound-control:hover,.sound-control:focus-within{opacity:1;transform:translateY(-2px);background:rgba(4,8,18,.9)}
.sound-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.06);color:#dbe8ff;
  font-size:13px;font-weight:700;line-height:1;transition:background .2s,border-color .2s,transform .2s}
.sound-btn:hover{background:rgba(88,180,255,.18);border-color:rgba(88,180,255,.42);transform:translateY(-1px)}
.sound-slider{flex:1;min-width:0;height:4px;border-radius:999px;appearance:none;cursor:pointer;
  background:linear-gradient(90deg,var(--gold) 0 var(--volume-fill,70%),rgba(255,255,255,.18) var(--volume-fill,70%) 100%);
  outline:none}
.sound-slider::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid var(--gold);box-shadow:0 0 12px rgba(245,217,126,.55)}
.sound-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid var(--gold);box-shadow:0 0 12px rgba(245,217,126,.55)}
.sound-percent{width:34px;text-align:right;color:#dbe8ff;font-size:11px;font-weight:700;letter-spacing:1px;
  font-variant-numeric:tabular-nums}

/* COMPLETE */
.complete{position:fixed;inset:0;z-index:25;pointer-events:none;display:grid;place-items:center;
  text-align:center;opacity:0;background:radial-gradient(circle at 50% 44%,rgba(245,217,126,.11),rgba(3,5,15,.82) 55%,rgba(3,5,15,.97))}
.complete.on{animation:completeAnim 2.8s ease forwards}
.complete b{display:block;font-size:60px;font-weight:700;letter-spacing:6px;
  background:linear-gradient(135deg,#fff 20%,var(--gold) 50%,#fff 80%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(245,217,126,.4))}
.complete span{display:block;margin-top:12px;color:var(--gold);font-size:14px;font-weight:700;letter-spacing:5px}
@keyframes completeAnim{0%{opacity:0;filter:blur(14px)}14%,75%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(10px)}}

.arena.draft-exit .champ-card,.arena.draft-exit .ban-slot{
  transform-origin:center;
  will-change:transform,opacity,filter;
}
.arena.results-ready{opacity:0;transition:opacity .5s ease}

/* ── 플레이어 VS 화면 ── */
.matchup-results{position:fixed;inset:0;z-index:24;pointer-events:none;opacity:0;
  display:grid;grid-template-columns:1fr 76px 1fr;
  background:
    radial-gradient(ellipse 60% 90% at 14% 50%,rgba(15,45,120,.6),transparent 58%),
    radial-gradient(ellipse 60% 90% at 86% 50%,rgba(120,15,30,.55),transparent 58%),
    rgba(3,5,15,.97);
  transform:scale(1.04);filter:blur(16px);overflow:hidden}
.matchup-results.on{animation:resultsIn .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes resultsIn{to{opacity:1;transform:scale(1);filter:blur(0)}}
.vs-team{display:flex;flex-direction:column;padding:6px 14px;justify-content:center}
/* ── 선수 행 ── */
.vs-player{
  flex:1;position:relative;display:flex;align-items:stretch;gap:0;
  overflow:hidden;border-radius:10px;margin:3px 0;
  opacity:0;transition:opacity .5s ease,transform .55s cubic-bezier(.16,1,.3,1)}
.blue-team .vs-player{transform:translateX(-56px)}
.red-team .vs-player{flex-direction:row-reverse;transform:translateX(56px)}
.vs-player.in{opacity:1;transform:translateX(0)}
/* 사이드 컬러 바 */
.vs-player-bar{
  position:absolute;top:0;bottom:0;width:3px;z-index:3;
  opacity:0;transition:opacity .4s .5s;flex-shrink:0}
.blue-team .vs-player-bar{left:0;background:linear-gradient(to bottom,transparent,rgba(88,180,255,.95),transparent)}
.red-team .vs-player-bar{right:0;background:linear-gradient(to bottom,transparent,rgba(255,77,106,.95),transparent)}
.vs-player.in .vs-player-bar{opacity:1}
/* ── 정보 블록 ── */
.vs-main{
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;flex-shrink:0;width:52%;
  position:relative;z-index:1;overflow:hidden}
.blue-team .vs-main{
  background:linear-gradient(105deg,rgba(8,22,62,.92),rgba(4,8,22,.9) 55%,rgba(3,5,15,.88))}
.red-team .vs-main{
  padding:10px 18px;flex-direction:row-reverse;
  background:linear-gradient(255deg,rgba(62,8,18,.92),rgba(22,4,8,.9) 55%,rgba(15,3,5,.88))}
/* 격자 패턴 */
.vs-main::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:28px 28px}
/* 상단 하이라이트 */
.vs-main::after{
  content:'';position:absolute;top:0;height:1px;left:0;right:0;pointer-events:none}
.blue-team .vs-main::after{background:linear-gradient(to right,rgba(88,180,255,.85),rgba(88,180,255,.1) 70%,transparent)}
.red-team .vs-main::after{background:linear-gradient(to left,rgba(255,77,106,.85),rgba(255,77,106,.1) 70%,transparent)}
/* ── 아바타 래퍼 ── */
.vs-avatar-wrap{position:relative;flex-shrink:0;width:80px;height:80px}
/* 세그먼트 링 (4분할 호, 갭 있음) */
.vs-avatar-ring{
  position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(
    rgba(var(--tc-rgb),.85) 0deg 82deg, transparent 82deg 98deg,
    rgba(var(--tc-rgb),.85) 98deg 180deg, transparent 180deg 196deg,
    rgba(var(--tc-rgb),.85) 196deg 278deg, transparent 278deg 294deg,
    rgba(var(--tc-rgb),.85) 294deg 360deg
  );
  -webkit-mask:radial-gradient(transparent calc(100% - 2px),black calc(100% - 2px));
  mask:radial-gradient(transparent calc(100% - 2px),black calc(100% - 2px));
  filter:drop-shadow(0 0 5px rgba(var(--tc-rgb),.8));
  opacity:0;transition:opacity .5s .5s}
.vs-player.in .vs-avatar-ring{opacity:1}
/* 얇은 외곽 링 */
.vs-avatar-wrap::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(var(--tc-rgb),.18);pointer-events:none;
  opacity:0;transition:opacity .5s .5s}
.vs-player.in .vs-avatar-wrap::before{opacity:1}
.vs-avatar{
  width:80px;height:80px;border-radius:50%;overflow:hidden;
  background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:26px}
.blue-team .vs-avatar{border:2px solid rgba(88,180,255,.88);
  box-shadow:0 0 28px rgba(88,180,255,.55),0 0 8px rgba(88,180,255,.8),inset 0 0 14px rgba(88,180,255,.1)}
.red-team .vs-avatar{border:2px solid rgba(255,77,106,.88);
  box-shadow:0 0 28px rgba(255,77,106,.55),0 0 8px rgba(255,77,106,.8),inset 0 0 14px rgba(255,77,106,.1)}
.vs-avatar img{width:100%;height:100%;object-fit:cover;display:block}
/* ── 텍스트 영역 ── */
.vs-info{flex:1;min-width:0;position:relative;z-index:1}
.blue-team .vs-info{text-align:left}
.red-team .vs-info{text-align:right}
.vs-name{
  font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blue-team .vs-name{
  background:linear-gradient(120deg,#fff 10%,#c8eaff 55%,#9bd7ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(88,180,255,.5))}
.red-team .vs-name{
  background:linear-gradient(240deg,#fff 10%,#ffc8d5 55%,#ff9aad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(255,77,106,.5))}
.vs-name-line{
  height:1px;margin:5px 0 6px;width:55%;
  opacity:.4;transition:width .7s ease .4s}
.blue-team .vs-name-line{background:linear-gradient(to right,rgba(88,180,255,.9),transparent)}
.red-team .vs-name-line{background:linear-gradient(to left,rgba(255,77,106,.9),transparent);margin-left:auto}
.vs-badges{display:flex;align-items:center;gap:7px}
.red-team .vs-badges{flex-direction:row-reverse}
.tier-tag{
  position:relative;overflow:hidden;
  font-size:12px;font-weight:700;letter-spacing:2px;padding:4px 11px;border-radius:6px;
  background:linear-gradient(135deg,rgba(var(--tc-rgb),.28),rgba(var(--tc-rgb),.12));
  border:1px solid rgba(var(--tc-rgb),.65);
  color:rgb(var(--tc-rgb));text-transform:uppercase;
  text-shadow:0 0 14px rgba(var(--tc-rgb),.85);
  box-shadow:0 0 14px rgba(var(--tc-rgb),.25),inset 0 1px 0 rgba(255,255,255,.12)}
/* 티어 태그 상단 빛 반사 */
.tier-tag::before{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent);pointer-events:none}
.pos-tag{
  font-size:10px;font-weight:700;letter-spacing:2px;color:#6a80a0;text-transform:uppercase;
  padding:4px 9px;border:1px solid rgba(255,255,255,.12);border-radius:6px;
  background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.vs-record{display:flex;align-items:center;gap:7px;margin-top:6px}
.red-team .vs-record{flex-direction:row-reverse}
.record-text{font-size:11px;font-weight:700;color:#7a90ac;white-space:nowrap;letter-spacing:.5px}
.winbar{
  flex:1;height:4px;border-radius:999px;overflow:hidden;max-width:100px;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 4px rgba(0,0,0,.4)}
.winbar-fill{height:100%;border-radius:999px;transition:width 1.1s cubic-bezier(.16,1,.3,1) .5s}
.blue-team .winbar-fill{background:linear-gradient(90deg,rgba(88,180,255,.65),#b8e8ff);box-shadow:0 0 6px rgba(88,180,255,.5)}
.red-team .winbar-fill{background:linear-gradient(90deg,#ffb8c8,rgba(255,77,106,.8));box-shadow:0 0 6px rgba(255,77,106,.5)}
.winpct{font-size:13px;font-weight:700;min-width:34px;letter-spacing:.5px}
.blue-team .winpct{color:#9bd7ff;text-shadow:0 0 10px rgba(88,180,255,.5)}
.red-team .winpct{color:#ff9aad;text-shadow:0 0 10px rgba(255,77,106,.5)}
.vs-form{display:flex;gap:4px;margin-top:6px;align-items:center}
.red-team .vs-form{flex-direction:row-reverse}
.fd{
  width:24px;height:24px;border-radius:6px;font-size:9px;font-weight:700;
  display:grid;place-items:center;letter-spacing:.5px;position:relative;overflow:hidden}
/* 상단 반사광 */
.fd::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:linear-gradient(to bottom,rgba(255,255,255,.18),transparent);pointer-events:none}
.fd.w{
  background:linear-gradient(135deg,rgba(88,180,255,.32),rgba(88,180,255,.14));
  color:#9de0ff;border:1px solid rgba(88,180,255,.55);
  box-shadow:0 0 8px rgba(88,180,255,.3),inset 0 0 6px rgba(88,180,255,.1);
  text-shadow:0 0 8px rgba(88,180,255,.8)}
.fd.l{
  background:linear-gradient(135deg,rgba(255,77,106,.26),rgba(255,77,106,.1));
  color:#ff9aad;border:1px solid rgba(255,77,106,.5);
  box-shadow:0 0 8px rgba(255,77,106,.25),inset 0 0 6px rgba(255,77,106,.08);
  text-shadow:0 0 8px rgba(255,77,106,.7)}
/* ── 오른쪽 데코 블록 ── */
.vs-deco{
  flex:1;position:relative;overflow:hidden;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(3,5,15,.88)}
/* 미세 격자 */
.vs-deco::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(var(--tc-rgb),.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(var(--tc-rgb),.03) 1px,transparent 1px);
  background-size:22px 22px}
/* 중앙 라디얼 글로우 */
.vs-deco::after{
  content:'';position:absolute;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--tc-rgb),.18) 0%,transparent 70%);
  pointer-events:none}
/* 다이아몬드 외곽 프레임 */
.vs-deco-diamond-outer{
  position:absolute;width:148px;height:148px;
  transform:rotate(45deg);
  border:1px solid rgba(var(--tc-rgb),.22);
  opacity:0;transition:opacity .5s .35s}
.vs-player.in .vs-deco-diamond-outer{opacity:1}
/* 다이아몬드 내부 프레임 (펄스) */
.vs-deco-ring{
  position:absolute;width:116px;height:116px;
  transform:rotate(45deg);
  border:1.5px solid rgba(var(--tc-rgb),.55);
  box-shadow:0 0 20px rgba(var(--tc-rgb),.3),inset 0 0 20px rgba(var(--tc-rgb),.12);
  opacity:0;transition:opacity .6s .5s}
.vs-player.in .vs-deco-ring{opacity:1;animation:diamondPulse 3s ease-in-out infinite}
@keyframes diamondPulse{
  0%,100%{box-shadow:0 0 20px rgba(var(--tc-rgb),.3),inset 0 0 20px rgba(var(--tc-rgb),.12);border-color:rgba(var(--tc-rgb),.55)}
  50%{box-shadow:0 0 34px rgba(var(--tc-rgb),.55),inset 0 0 28px rgba(var(--tc-rgb),.22);border-color:rgba(var(--tc-rgb),.85)}}
/* 다이아몬드 4꼭짓점 도트 */
.vs-deco-ring-outer{
  position:absolute;width:116px;height:116px;transform:rotate(45deg);z-index:1}
.vs-deco-ring-outer::before,.vs-deco-ring-outer::after{
  content:'';position:absolute;width:7px;height:7px;border-radius:1px;
  background:rgb(var(--tc-rgb));transform:rotate(0deg);
  box-shadow:0 0 10px rgba(var(--tc-rgb),1),0 0 4px rgba(255,255,255,.6)}
.vs-deco-ring-outer::before{top:-3.5px;left:50%;margin-left:-3.5px}
.vs-deco-ring-outer::after{bottom:-3.5px;left:50%;margin-left:-3.5px}
/* 티어 엠블럼 */
.tier-emblem{
  position:relative;z-index:2;width:108px;height:108px;
  display:grid;place-items:center;flex-shrink:0;
  opacity:0;transition:opacity .7s ease .55s}
.vs-player.in .tier-emblem{opacity:1}
.tier-emblem img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 6px rgba(var(--tc-rgb),1)) drop-shadow(0 0 22px rgba(var(--tc-rgb),.85)) drop-shadow(0 0 48px rgba(var(--tc-rgb),.45))}
/* 승률 */
.vs-deco-pct{
  position:relative;z-index:2;
  font-size:14px;font-weight:700;letter-spacing:3px;
  color:rgb(var(--tc-rgb));
  text-shadow:0 0 14px rgba(var(--tc-rgb),.8);
  opacity:0;transition:opacity .5s ease .85s}
.vs-player.in .vs-deco-pct{opacity:1}
/* 코너 브라켓 (티어 컬러) */
.vs-deco-corner{position:absolute;width:14px;height:14px;z-index:2;opacity:.6}
.vs-deco-corner::before,.vs-deco-corner::after{content:'';position:absolute;background:rgb(var(--tc-rgb))}
.vs-deco-corner::before{width:100%;height:1.5px;top:0;left:0}
.vs-deco-corner::after{width:1.5px;height:100%;top:0;left:0}
.vs-deco-corner.tl{top:8px;left:8px}
.vs-deco-corner.br{bottom:8px;right:8px;transform:rotate(180deg)}
/* 중앙 구분선 */
.vs-divider{display:flex;flex-direction:column;align-items:center;padding:12px 0;position:relative}
.vs-divider::before{
  content:'';position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent 2%,rgba(255,255,255,.1) 22%,rgba(245,217,126,.4) 50%,rgba(255,255,255,.1) 78%,transparent 98%)}
.lane-node{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;z-index:1}
.lane-node-diamond{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);opacity:.6}
.lane-node-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;
  text-shadow:0 0 14px rgba(245,217,126,.55)}
.lane-node-vs{font-size:10px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:2px}

/* POST DRAFT PREMIUM BOARD */
.matchup-results{

    linear-gradient(90deg,rgba(88,180,255,.2),transparent 18%,transparent 82%,rgba(255,77,106,.2)),

    radial-gradient(ellipse 48% 95% at 100% 50%,rgba(255,45,82,.5),transparent 62%),
    radial-gradient(circle at 50% 8%,rgba(245,217,126,.16),transparent 34%),
    linear-gradient(180deg,#03050f 0%,#050916 46%,#02030a 100%);
  isolation:isolate}
.matchup-results::before{
  content:'POST DRAFT LINEUP';position:absolute;top:28px;left:50%;z-index:2;
  transform:translateX(-50%);font-size:42px;font-weight:700;letter-spacing:8px;white-space:nowrap;
  background:linear-gradient(100deg,#fff 8%,var(--gold) 50%,#dcecff 92%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;

.matchup-results::after{
  content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(90deg,transparent 0 3%,rgba(88,180,255,.24) 3.1%,transparent 3.4% 96.6%,rgba(255,77,106,.22) 96.9%,transparent 97.2%),
    linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:100% 100%,54px 54px,54px 54px;
  mask-image:radial-gradient(ellipse 82% 72% at 50% 52%,black 0 58%,transparent 100%)}
.vs-team{position:relative;gap:10px;padding:0;min-width:0}
.vs-team::before{
  position:absolute;top:-50px;font-size:14px;font-weight:700;letter-spacing:5px;
  color:rgba(255,255,255,.82);text-shadow:0 0 18px currentColor}
.blue-team::before{content:'BLUE TEAM';left:8px;color:#a9ddff}
.red-team::before{content:'RED TEAM';right:8px;color:#ffbdc9}
.vs-player{
  flex:1 1 0;min-height:0;margin:0;border-radius:8px;
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 20px 46px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(18px)}
.blue-team .vs-player{transform:translateX(-72px) scale(.98)}
.red-team .vs-player{transform:translateX(72px) scale(.98)}
.vs-player.in{transform:translateX(0) scale(1)}
.vs-player::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    linear-gradient(90deg,rgba(var(--tc-rgb),.18),transparent 42%,rgba(255,255,255,.035) 50%,transparent 72%),

.red-team .vs-player::before{

    linear-gradient(270deg,rgba(var(--tc-rgb),.18),transparent 42%,rgba(255,255,255,.035) 50%,transparent 72%),

.vs-player-bar{width:5px;border-radius:999px;margin:12px 0;top:0;bottom:0}
.vs-main{width:58%;min-width:0;padding:10px 18px;gap:16px;background:rgba(3,7,18,.58)}
.red-team .vs-main{padding:10px 18px;background:rgba(18,3,8,.58)}
.vs-main::before{background-size:34px 34px;opacity:.75}
.vs-avatar-wrap{width:84px;height:84px}
.vs-avatar{width:84px;height:84px;border-radius:18px;font-size:28px}
.vs-avatar-ring,.vs-avatar-wrap::before{border-radius:24px}
.vs-name{max-width:100%;font-size:26px;letter-spacing:1px}
.vs-name-line{height:2px;margin:5px 0 6px}
.tier-tag{
  border-radius:5px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.22),transparent 42%),
    linear-gradient(135deg,rgba(var(--tc-rgb),.46),rgba(var(--tc-rgb),.16) 48%,rgba(0,0,0,.32));
  border:1px solid rgba(var(--tc-rgb),.78);
  color:#f4fbff;
  box-shadow:
    0 0 18px rgba(var(--tc-rgb),.32),
    inset 0 1px 0 rgba(255,255,255,.24),

.tier-tag::after{
  content:'';position:absolute;inset:1px;border-radius:4px;pointer-events:none;
  border:1px solid rgba(255,255,255,.08)}
.pos-tag{
  border-radius:5px;
  background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.025));
  border-color:rgba(255,255,255,.18);

.vs-record{margin-top:6px}
.winbar{height:6px;max-width:126px}
.vs-form{margin-top:6px}
.fd{width:25px;height:20px;border-radius:4px}
.vs-deco{

  background:
    radial-gradient(circle at 50% 48%, rgba(var(--tc-rgb),.38) 0%, rgba(var(--tc-rgb),.12) 38%, transparent 62%),

    linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.01) 44%,rgba(0,0,0,.32)),

.vs-deco-diamond-outer,.vs-deco-ring,.vs-deco-ring-outer{display:none}

/* 내부 원 장식 (inset이므로 overflow 없음) */
.tier-emblem::before{

    radial-gradient(circle at 48% 38%,rgba(255,255,255,.12),rgba(var(--tc-rgb),.18) 42%,rgba(0,0,0,.5));

.vs-deco-corner{position:absolute;width:16px;height:16px;z-index:2;opacity:.7}
.vs-deco-corner::before,.vs-deco-corner::after{

.vs-deco-corner::before{width:100%;height:1.5px;top:0;left:0}
.vs-deco-corner::after{width:1.5px;height:100%;top:0;left:0}

}

/* ====================================================
   CINEMA — 전체 재설계
   Total duration: 4.8s
   0–8%   : 입장 (0–0.38s)
   8–20%  : ban=크랙 / pick=충격파+레이
   20–22% : 플래시 임팩트
   22–80% : 메인 (ban=파편비산 / pick=글로우 유지)
   80–100%: 퇴장
==================================================== */
.cinema{position:fixed;inset:0;z-index:20;pointer-events:none;
  display:grid;place-items:center;opacity:0}
.cinema.on{animation:cFade 4.8s ease forwards}
@keyframes cFade{
  0%{opacity:0;backdrop-filter:blur(0)}
  6%{opacity:1;backdrop-filter:blur(5px)}
  78%{opacity:1}
  100%{opacity:0;backdrop-filter:blur(0)}}

/* 카드 래퍼 */
.c-wrap{position:relative;width:380px;height:630px}

/* 충격파 링 (픽 전용) */
.c-ring{position:absolute;left:50%;top:42%;border-radius:50%;
  width:60px;height:60px;margin-left:-30px;margin-top:-30px;
  border:3px solid transparent;opacity:0;pointer-events:none}
.pick-blue.on .c-ring{border-color:rgba(88,180,255,.9);animation:ringExpand 1.1s ease-out forwards}
.pick-red.on .c-ring{border-color:rgba(255,77,106,.9);animation:ringExpand 1.1s ease-out forwards}
.c-ring.r2{animation-delay:.18s!important}
.c-ring.r3{animation-delay:.36s!important}
@keyframes ringExpand{
  0%{transform:scale(0);opacity:1;border-width:5px}
  40%{opacity:.6}
  100%{transform:scale(18);opacity:0;border-width:1px}}

/* 메인 카드 — overflow:visible 로 파편이 바깥으로 날아감 */
.cinema-card{position:absolute;inset:0;border-radius:26px;overflow:visible;
  border:1px solid rgba(255,255,255,.18)}
/* 배경 클립 영역 — 둥근 모서리 안에서만 스플래시/이펙트 렌더 */
.c-card-clip{position:absolute;inset:0;overflow:hidden;border-radius:26px}

/* 픽 입장 */
.pick-blue.on .cinema-card,.pick-red.on .cinema-card{animation:pickEntry 4.8s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pickEntry{
  0%{transform:translateY(130px) scale(.6);filter:blur(28px) brightness(2.5);opacity:0}
  7%{transform:translateY(-14px) scale(1.07);filter:blur(0) brightness(1.6);opacity:1}
  14%{transform:translateY(0) scale(1);filter:blur(0) brightness(1.12)}
  74%{transform:translateY(0) scale(1);filter:blur(0) brightness(1);opacity:1}
  100%{transform:translateY(-55px) scale(1.35);filter:blur(22px) brightness(1.6);opacity:0}}

/* 밴 입장 */
.ban-mode.on .cinema-card{animation:banEntry 4.8s ease forwards}
@keyframes banEntry{
  0%{transform:scale(.75);filter:blur(18px) brightness(.4);opacity:0}
  7%{transform:scale(1.03);filter:blur(0) brightness(.78);opacity:1}
  13%{transform:scale(1);filter:blur(0) brightness(.78)}
  62%{filter:blur(0) brightness(.78);opacity:1}
  80%{opacity:0}
  100%{opacity:0}}

/* 블러 배경 (빈 여백 채우기) */
.c-splash-bg{position:absolute;inset:-12px;
  background-image:var(--cS);background-size:cover;background-position:center 15%;
  filter:blur(22px) saturate(1.7) brightness(.38);transform:scale(1.05)}
.ban-mode .c-splash-bg{filter:blur(22px) saturate(.3) brightness(.22)}

/* 샤프 원본 (contain → 챔피언 전체가 잘리지 않음) */
.c-splash{position:absolute;inset:0;
  background-image:var(--cS);background-size:contain;
  background-position:var(--face-pos,50% 8%);background-repeat:no-repeat}
.ban-mode .c-splash{filter:saturate(.22) brightness(.68) contrast(1.08)}

/* 사이드 글로우 */
.c-glow{position:absolute;inset:0;opacity:0;pointer-events:none}
.pick-blue .c-glow{background:linear-gradient(180deg,rgba(88,180,255,.22),transparent 48%);opacity:1}
.pick-red .c-glow{background:linear-gradient(180deg,rgba(255,77,106,.22),transparent 48%);opacity:1}

/* 픽 레이 (코닉 그라데이션) */
.c-rays{position:absolute;inset:-120%;opacity:0;mix-blend-mode:screen;pointer-events:none;border-radius:50%}
.pick-blue.on .c-rays{
  background:conic-gradient(from 0deg at 50% 38%,
    transparent 0deg,rgba(88,180,255,.55) 4deg,transparent 8deg,
    transparent 32deg,rgba(88,180,255,.4) 36deg,transparent 40deg,
    transparent 62deg,rgba(88,180,255,.5) 66deg,transparent 70deg,
    transparent 92deg,rgba(88,180,255,.35) 96deg,transparent 100deg,
    transparent 122deg,rgba(88,180,255,.45) 126deg,transparent 130deg,
    transparent 154deg,rgba(88,180,255,.3) 158deg,transparent 162deg,
    transparent 185deg,rgba(88,180,255,.52) 189deg,transparent 193deg,
    transparent 218deg,rgba(88,180,255,.38) 222deg,transparent 226deg,
    transparent 250deg,rgba(88,180,255,.46) 254deg,transparent 258deg,
    transparent 282deg,rgba(88,180,255,.3) 286deg,transparent 290deg,
    transparent 316deg,rgba(88,180,255,.5) 320deg,transparent 324deg);
  animation:raysOut 4.8s ease forwards}
.pick-red.on .c-rays{
  background:conic-gradient(from 0deg at 50% 38%,
    transparent 0deg,rgba(255,77,106,.55) 4deg,transparent 8deg,

@keyframes shardFly{

/* 임팩트 플래시 */
.c-flash{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,#fff,rgba(255,255,255,.5) 35%,transparent 65%);
  opacity:0}
.ban-mode.on .c-flash{animation:flashBan 4.8s ease forwards}
.pick-blue.on .c-flash,.pick-red.on .c-flash{animation:flashPick 4.8s ease forwards}
@keyframes flashBan{0%,19%{opacity:0}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
@keyframes flashPick{0%,6%{opacity:0}8.5%{opacity:.9}13%{opacity:0}100%{opacity:0}}

/* 보조 외부 플래시 (카드 바깥 번쩍임) */
.c-outer-flash{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.28),transparent 50%)}
.ban-mode.on .c-outer-flash{animation:outerFlash 4.8s ease forwards}
.pick-blue.on .c-outer-flash{animation:outerFlashPick 4.8s ease forwards;
  background:radial-gradient(circle at 50% 46%,rgba(88,180,255,.32),transparent 50%)}
.pick-red.on .c-outer-flash{animation:outerFlashPick 4.8s ease forwards;
  background:radial-gradient(circle at 50% 46%,rgba(255,77,106,.32),transparent 50%)}
@keyframes outerFlash{0%,19%{opacity:0}21%{opacity:1}28%{opacity:0}100%{opacity:0}}
@keyframes outerFlashPick{0%,6%{opacity:0}9%{opacity:1}16%{opacity:0}100%{opacity:0}}

/* 밴 빨간 빛 (충격 직전 긴장감) */
.c-red-pulse{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,rgba(255,48,80,.55),transparent 60%);opacity:0}
.ban-mode.on .c-red-pulse{animation:redPulse 4.8s ease forwards}
@keyframes redPulse{0%,7%{opacity:0}14%{opacity:.7}20%{opacity:0}100%{opacity:0}}

/* 그라데이션 베일 */
.c-veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,transparent 18%,rgba(0,0,0,.08) 50%,rgba(0,0,0,.9))}

/* 스탬프 — c-wrap 레벨, 카드 양옆으로 넘침 */
.c-stamp{position:absolute;left:-140px;right:-140px;top:50%;
  transform:translateY(-50%) rotate(-8deg);
  text-align:center;z-index:10;opacity:0;pointer-events:none;
  padding:10px 0;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  letter-spacing:10px;font-size:64px;font-weight:700}
.c-stamp.spick{border-color:rgba(255,255,255,.7);color:#fff;
  text-shadow:0 0 30px var(--stampGlow,#fff),0 3px 0 rgba(0,0,0,.7)}
.c-stamp.sban{border-color:rgba(255,48,80,.8);color:#ff3050;
  text-shadow:0 0 30px rgba(255,48,80,.9),0 0 60px rgba(255,48,80,.5),0 3px 0 rgba(0,0,0,.8)}
.pick-blue{--stampGlow:rgba(88,180,255,.9)}.pick-red{--stampGlow:rgba(255,77,106,.9)}
.pick-blue.on .c-stamp.spick,.pick-red.on .c-stamp.spick{animation:stampPick 4.8s ease forwards}
.ban-mode.on .c-stamp.sban{animation:stampBan 4.8s ease forwards}
@keyframes stampPick{
  0%,8%{opacity:0;transform:translateY(calc(-50% - 55px)) rotate(-6deg) scale(.7)}
  10%{opacity:1;transform:translateY(calc(-50% + 5px)) rotate(-6deg) scale(1.1);filter:brightness(2)}
  12%{transform:translateY(-50%) rotate(-6deg) scale(.95);filter:brightness(1)}
  14%{transform:translateY(-50%) rotate(-6deg) scale(1)}
  68%{opacity:1}78%{opacity:0}100%{opacity:0}}
@keyframes stampBan{
  0%,21%{opacity:0;transform:translateY(calc(-50% - 55px)) rotate(-8deg) scale(.7)}
  23%{opacity:1;transform:translateY(calc(-50% + 5px)) rotate(-8deg) scale(1.1);filter:brightness(2.5)}
  25%{transform:translateY(-50%) rotate(-8deg) scale(.95);filter:brightness(1)}
  27%{transform:translateY(-50%) rotate(-8deg) scale(1)}
  58%{opacity:1}70%{opacity:0}100%{opacity:0}}

/* 챔피언 이름 + 플레이어 */
.c-info{position:absolute;left:22px;right:22px;bottom:26px;z-index:3;text-align:center}

.la-champ-r{font-size:26px;font-weight:700;color:#ffa8b4;letter-spacing:1px;text-shadow:0 0 26px rgba(255,77,106,.9)}
.la-sep{font-size:15px;font-weight:700;color:rgba(245,217,126,.65)}

@keyframes laIn{

  100%{opacity:0;filter:blur(8px);transform:scale(.96)}
}
</style>
</head>

/* ── 배경 파티클 ── */
(function(){
  const cv=document.getElementById('particleCanvas'),ctx=cv.getContext('2d');
  let W,H,ps=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  resize();window.addEventListener('resize',resize);
  function rand(a,b){return a+(b-a)*Math.random()}
  class P{
    constructor(){this.reset(true)}
    reset(i){this.x=rand(0,W);this.y=i?rand(0,H):H+8;
      this.vy=-rand(.15,.5);this.vx=rand(-.09,.09);
      this.r=rand(.7,2);this.life=0;this.ml=rand(200,480);
      const t=Math.random();
      this.col=t<.45?'rgba(88,180,255,':'t<.75'?'rgba(245,217,126,':'rgba(255,77,106,';
      if(t<.45)this.col='rgba(88,180,255,';
      else if(t<.75)this.col='rgba(245,217,126,';
      else this.col='rgba(255,77,106,';}
    update(){this.x+=this.vx;this.y+=this.vy;this.life++;
      if(this.life>this.ml||this.y<-8)this.reset(false)}
    draw(){const a=Math.sin(this.life/this.ml*Math.PI)*.6;
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fillStyle=this.col+a+')';ctx.fill();}
  }
  for(let i=0;i<88;i++)ps.push(new P());
  (function loop(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.update();p.draw()});requestAnimationFrame(loop)})();
})();

/* ── 버스트 파티클 캔버스 ── */
const burstCv=document.getElementById('burstCanvas');
const burstCtx=burstCv.getContext('2d');
burstCv.width=innerWidth;burstCv.height=innerHeight;
window.addEventListener('resize',()=>{burstCv.width=innerWidth;burstCv.height=innerHeight});
let burstParticles=[];
function spawnBurst(cx,cy,color,count){
  burstCv.classList.add('on');
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*8;
    const size=1+Math.random()*4;
    burstParticles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      r:size,life:0,maxLife:40+Math.random()*50,color,trail:[]});
  }
}
function animateBurst(){
  if(!burstParticles.length){burstCv.classList.remove('on');burstCtx.clearRect(0,0,burstCv.width,burstCv.height);return}
  burstCtx.clearRect(0,0,burstCv.width,burstCv.height);
  burstParticles=burstParticles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.96;p.life++;
    const a=Math.max(0,1-p.life/p.maxLife);
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>6)p.trail.shift();
    if(p.trail.length>1){
      burstCtx.beginPath();burstCtx.moveTo(p.trail[0].x,p.trail[0].y);
      p.trail.forEach(t=>burstCtx.lineTo(t.x,t.y));
      burstCtx.strokeStyle=p.color.replace('A)',a*.5+')');
      burstCtx.lineWidth=p.r*.5;burstCtx.stroke();
    }
    burstCtx.beginPath();burstCtx.arc(p.x,p.y,p.r*a,0,Math.PI*2);
    burstCtx.fillStyle=p.color.replace('A)',a+')');burstCtx.fill();
    return p.life<p.maxLife;
  });
  requestAnimationFrame(animateBurst);
}

function scatterDraftCards(){
  const cards=[...document.querySelectorAll('.champ-card,.ban-slot')];
  const rand=(a,b)=>a+(b-a)*Math.random();
  const signed=()=>Math.random()<.5?-1:1;
  function randomExit(rect){
    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;
    const edge=Math.floor(Math.random()*4);
    let targetX,targetY;
    if(edge===0){targetX=rand(-innerWidth*.25,innerWidth*1.25);targetY=-rect.height-rand(90,innerHeight*.35)}
    else if(edge===1){targetX=innerWidth+rect.width+rand(90,innerWidth*.35);targetY=rand(-innerHeight*.15,innerHeight*1.15)}
    else if(edge===2){targetX=rand(-innerWidth*.25,innerWidth*1.25);targetY=innerHeight+rect.height+rand(90,innerHeight*.35)}
    else{targetX=-rect.width-rand(90,innerWidth*.35);targetY=rand(-innerHeight*.15,innerHeight*1.15)}
    return {x:targetX-centerX,y:targetY-centerY};
  }
  function bezier(p0,p1,p2,p3,t){
    const u=1-t,tt=t*t,uu=u*u;
    const uuu=uu*u,ttt=tt*t;
    return uuu*p0+3*uu*t*p1+3*u*tt*p2+ttt*p3;
  }
  function smoothstep(t){return t*t*(3-2*t)}
  const flights=cards.map((el,i)=>{
    const rect=el.getBoundingClientRect();
    const out=randomExit(rect);
    const cx1=signed()*rand(innerWidth*.12,innerWidth*.28);
    const cy1=signed()*rand(innerHeight*.08,innerHeight*.2);
    const cx2=out.x*.45+signed()*rand(innerWidth*.08,innerWidth*.22);
    const cy2=out.y*.45+signed()*rand(innerHeight*.08,innerHeight*.22);
    return {
      el,out,
      p1:{x:cx1,y:cy1},
      p2:{x:cx2,y:cy2},
      rot:signed()*rand(130,280),
      wave:signed()*rand(18,54),
      wave2:signed()*rand(8,28),
      dur:rand(2050,2550),
      delay:Math.random()*130,
      start:performance.now()+Math.random()*130,
      baseSkew:el.matches('.red-strip .champ-card')?3:el.matches('.champ-card')?-3:0
    };
  });
  cards.forEach((el,i)=>{
    const baseSkew=el.matches('.red-strip .champ-card')?3:el.matches('.champ-card')?-3:0;
    el.style.animation='none';
    el.style.transform=`translate(0,0) skewX(${baseSkew}deg) rotate(0deg) scale(1)`;
    el.style.opacity='1';
    el.style.filter='blur(0) brightness(1)';
  });
  document.querySelector('.arena')?.classList.add('draft-exit');
  spawnBurst(innerWidth/2,innerHeight/2,'rgba(245,217,126,A)',70);animateBurst();
  function frame(now){
    let running=false;
    flights.forEach(f=>{
      const raw=(now-f.start)/f.dur;
      const t=Math.max(0,Math.min(1,raw));
      if(t<1)running=true;
      const e=smoothstep(t);
      const x=bezier(0,f.p1.x,f.p2.x,f.out.x,e);
      const y=bezier(0,f.p1.y,f.p2.y,f.out.y,e);
      const drift=Math.sin(e*Math.PI*2.4)*f.wave*(1-e)+Math.sin(e*Math.PI*5.2)*f.wave2*(1-e);
      const rot=f.rot*e+Math.sin(e*Math.PI*3)*10*(1-e);
      const scale=1+.04*Math.sin(e*Math.PI*2)-.45*e;
      const opacity=e>.78?Math.max(0,1-(e-.78)/.22):1;
      const blur=e>.78?(e-.78)/.22*12:0;
      f.el.style.opacity=opacity.toFixed(3);
      f.el.style.filter=`blur(${blur.toFixed(1)}px) brightness(${(1+.45*e).toFixed(2)})`;
      f.el.style.transform=`translate(${x.toFixed(1)}px,${(y+drift).toFixed(1)}px) skewX(${f.baseSkew}deg) rotate(${rot.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
    });
    if(running)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function clampVolume(v){return Math.max(0,Math.min(1,Number.isFinite(v)?v:.7))}
function syncSoundControl(v){

function setBgmVolume(v,save=true){
  const vol=clampVolume(v),b=$('bgm'),voice=$('champVoice');
  if(b){b.volume=vol;b.muted=vol===0}

  if(vol>0)lastBgmVolume=vol;
  if(save)localStorage.setItem(BGM_VOLUME_KEY,String(vol));

let inhouseTeams={blue:[],red:[]};
function ihName(side,slotIdx){
  const team=side==='blue'?inhouseTeams.blue:inhouseTeams.red;
  if(!team?.length)return null;
  const p=team.find(t=>Number.isInteger(t?.posSlot)&&t.posSlot===slotIdx)||team[slotIdx];
  if(!p)return null;
  return dname(p.name||'');
}

function connectDraftLive(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}`);
  ws.onmessage=ev=>{try{const m=JSON.parse(ev.data);
    if(m.type==='lcu_champ_select')applyLiveDraft(m.data,true);
    if(m.type==='state'){
      if(m.data?.inhouseTeams)inhouseTeams=m.data.inhouseTeams;
      if(m.data?.lcuDraft)applyLiveDraft(m.data.lcuDraft,true);
    }
    if(m.type==='inhouse_teams_update'&&m.inhouseTeams)inhouseTeams=m.inhouseTeams;
  }catch(e){}};
  ws.onclose=()=>setTimeout(connectDraftLive,1500);
}
function liveBlankTeam(s){return Array.from({length:5},(_,i)=>[laneLabel('',i),`${s==='blue'?'참가자':'레드'} ${i+1}`,'','대기 중'])}
function liveBlankBans(){return Array.from({length:5},()=>['','대기 중'])}
// 픽 순서(시간순)로 카드 배치 — 왼쪽=1번픽, 오른쪽=5번픽
function liveTeamByLane(side, allPlayers, completedActions){
  const rows=liveBlankTeam(side);
  const ihTeam=side==='blue'?inhouseTeams.blue:inhouseTeams.red;

  // 픽 완료 액션을 id 순(시간순)으로 정렬
  const picks=(completedActions||[])
    .filter(a=>a.type==='pick'&&a.side===side&&a.championId&&a.completed)
    .sort((a,b)=>a.id-b.id);

  const playerByCellId=new Map((allPlayers||[]).map(p=>[Number(p.cellId),p]));

  picks.forEach((action,slotIdx)=>{
    if(slotIdx>=5)return;
    const lcu=playerByCellId.get(Number(action.actorCellId));
    const champId=Number(action.championId||0);
    const [champKey,champKr]=champMeta(champId);
    const lane=lcu?laneKey(lcu.lane):'';

    // 이름: posSlot으로 inhouse 매칭 → LCU 순
    let name='';
    if(ihTeam?.length){
      const laneIdx=lane?LANE_ORDER.indexOf(lane):-1;
      const ihP=laneIdx>=0
        ?(ihTeam.find(p=>p?.posSlot===laneIdx)||ihTeam[slotIdx])
        :ihTeam[slotIdx];
      if(ihP)name=dname(ihP.name);
    }
    if(!name&&lcu)name=dname(lcu.name);
    if(!name)name=`${side==='blue'?'블루':'레드'} ${slotIdx+1}`;

    // 밴픽 화면 중에는 닉네임 비공개
    rows[slotIdx]=[laneLabel(lane,slotIdx),'',champKey,champKr,lane||LANE_ORDER[slotIdx]];
  });
  return rows;
}
function applyLiveDraft(draft,animate){
  lastLiveDraft=draft;
  const nowCS=!!(draft?.connected&&draft?.inChampSelect&&draft?.session);
  if(nowCS&&!bgmInChampSelect){bgmInChampSelect=true;if(bgmUnlocked)bgmPlay()}
  else if(!nowCS&&bgmInChampSelect){bgmInChampSelect=false;bgmStop()}
  if(!draft?.connected){liveCompleteShown=false;setToast(draft?.error||'롤 클라이언트를 기다리는 중');setPhase('ban','클라이언트 대기');return}
  if(!draft?.inChampSelect||!draft.session){liveCompleteShown=false;setToast('챔피언 선택 화면 대기 중');setPhase('ban','밴픽 대기');return}
  const s=draft.session;
  const nb=liveBlankTeam('blue'),nr=liveBlankTeam('red'),nbb=liveBlankBans(),nrb=liveBlankBans();
  const completed=(s.actions||[]).filter(a=>a.completed&&a.championId);
  const bc={blue:0,red:0};
  liveTeamByLane('blue',s.blue,completed).forEach((p,i)=>{nb[i]=p});
  liveTeamByLane('red',s.red,completed).forEach((p,i)=>{nr[i]=p});
  completed.filter(a=>a.type==='ban').forEach(a=>{const m=champMeta(a.championId);const pos=bc[a.side]++;
    if(a.side==='blue'&&pos<5)nbb[pos]=m;if(a.side==='red'&&pos<5)nrb[pos]=m});
  blue=nb;red=nr;blueBans=nbb;redBans=nrb;render();
  // 픽 순서로 카드 공개 (slotIdx = 이 픽이 몇 번째 픽인지)
  ['blue','red'].forEach(side=>{
    const sidePicks=completed.filter(a=>a.type==='pick'&&a.side===side&&a.completed).sort((a,b)=>a.id-b.id);
    sidePicks.forEach((a,slotIdx)=>{
      const t=side==='blue'?blue:red;
      if(t[slotIdx]?.[3]!=='대기 중')
        document.querySelector(`.champ-card[data-side="${side}"][data-idx="${slotIdx}"]`)?.classList.add('revealed');
    });
  });
  completed.filter(a=>a.type==='ban').forEach(a=>{
    const matches=completed.filter(x=>x.type==='ban'&&x.side===a.side);
    const pos=matches.findIndex(x=>x.id===a.id);
    if(pos>=0)document.querySelector(`[data-ban="${a.side}-${pos}"]`)?.classList.add('revealed')});
  const pickCount=completed.filter(a=>a.type==='pick').length;
  const latest=completed[completed.length-1];
  const lk=latest?`${latest.id}:${latest.type}:${latest.championId}`:'';
  if(!applyLiveDraft.seen)applyLiveDraft.seen=new Set();
  const shouldAnim=animate&&liveInitialized&&latest&&!applyLiveDraft.seen.has(lk);
  completed.forEach(a=>applyLiveDraft.seen.add(`${a.id}:${a.type}:${a.championId}`));
  liveInitialized=true;
  if(shouldAnim){
    if(latest.type==='ban'){const pos=completed.filter(a=>a.type==='ban'&&a.side===latest.side).findIndex(a=>`${a.id}:${a.type}:${a.championId}`===lk);if(pos>=0)revealBan(latest.side,pos)}
    else{
      const sidePicks=completed.filter(a=>a.type==='pick'&&a.side===latest.side&&a.completed).sort((a,b)=>a.id-b.id);
      const slotIdx=sidePicks.findIndex(a=>a.id===latest.id);
      revealPick(latest.side,slotIdx>=0?slotIdx:latest.idx);
    }
    if(pickCount>=10&&!liveCompleteShown){liveCompleteShown=true;setTimeout(showComplete,5050)}
  }else{
    if(pickCount>=10&&!liveCompleteShown){liveCompleteShown=true;showComplete();return}
    const cur=(s.actions||[]).find(a=>a.inProgress);
    if(cur)setPhase(cur.type==='ban'?'ban':'pick',`${cur.side==='red'?'레드':'블루'} ${cur.type==='ban'?'금지':'선택'} 중`);
    setToast('롤 밴픽 화면과 자동 연동 중');
  }
}

window.addEventListener('beforeunload',stopAllAudio);

loadChampionMap();

/* ── 데모 / 라이브 ── */
const sequence=[
  ['ban','blue',0],['ban','red',0],['ban','blue',1],['ban','red',1],['ban','blue',2],['ban','red',2],
  ['pick','blue',0],['pick','red',0],['pick','blue',1],['pick','red',1],['pick','blue',2],['pick','red',2],
  ['pick','blue',3],['pick','red',3],['pick','blue',4],['pick','red',4],['complete','',0]
];
let seqIdx=-1;
let resultHoldTicks=0;
if(isPreviewVs){
  // VS 화면 즉시 미리보기
  render();
  setTimeout(showMatchupResults, 300);
}else if(isLiveMode){
  blue=liveBlankTeam('blue');red=liveBlankTeam('red');
  blueBans=liveBlankBans();redBans=liveBlankBans();
  render();setPhase('ban','클라이언트 대기');setToast('롤 클라이언트와 챔피언 선택 화면을 기다리는 중입니다.');
  connectDraftLive();
}else{
  render();
  setTimeout(()=>{
    resetDraftDemo();
    setInterval(()=>{
      if(resultHoldTicks>0){resultHoldTicks--;return}
      seqIdx=(seqIdx+1)%sequence.length;
      if(seqIdx===0){render();resetDraftDemo()}
      const[type,side,i]=sequence[seqIdx];
      if(type==='ban')revealBan(side,i);
      if(type==='pick')revealPick(side,i);
      if(type==='complete'){showComplete();resultHoldTicks=8}
    },5200);
  },1000);

  document.addEventListener('keydown',e=>{
    if(e.key==='m'||e.key==='M'){
      seqIdx=sequence.length-1;
      resultHoldTicks=0;
      bluePickOrder=[0,1,2,3,4];redPickOrder=[0,1,2,3,4];
      document.querySelectorAll('.champ-card').forEach(el=>el.classList.add('revealed'));
      document.querySelectorAll('.ban-slot').forEach(el=>el.classList.add('revealed'));
      $('cinema').className='cinema';
      $('complete').classList.remove('on');
      resetDraftDemo();
      showComplete();
      resultHoldTicks=8;
    }
  });
}
</script>
</body>
</html>
