<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Champion Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Rajdhani',sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 60% 78% at 50% 52%,transparent 12%,rgba(0,0,0,.98) 100%)}

#lbT,#lbB{position:fixed;left:0;right:0;height:80px;background:#000;z-index:8;
  transition:transform .55s cubic-bezier(.4,0,.2,1)}
#lbT{top:0;transform:translateY(-100%)}
#lbB{bottom:0;transform:translateY(100%)}

.bkt{position:fixed;width:44px;height:44px;z-index:9;opacity:0;
  transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1);transform:scale(.8)}
.bkt::before,.bkt::after{content:'';position:absolute;background:rgba(185,152,58,.55)}
.bkt.tl{top:24px;left:24px} .bkt.tl::before{top:0;left:0;width:100%;height:1px} .bkt.tl::after{top:0;left:0;width:1px;height:100%}
.bkt.tr{top:24px;right:24px} .bkt.tr::before{top:0;right:0;width:100%;height:1px} .bkt.tr::after{top:0;right:0;width:1px;height:100%}
.bkt.bl{bottom:24px;left:24px} .bkt.bl::before{bottom:0;left:0;width:100%;height:1px} .bkt.bl::after{bottom:0;left:0;width:1px;height:100%}
.bkt.br{bottom:24px;right:24px} .bkt.br::before{bottom:0;right:0;width:100%;height:1px} .bkt.br::after{bottom:0;right:0;width:1px;height:100%}
.bkt.show{opacity:1;transform:scale(1)}

#phase{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:10;text-align:center}
#phaseTop{display:block;font-size:.46rem;letter-spacing:12px;color:rgba(185,152,58,.32);text-transform:uppercase;font-weight:600}
#phaseLine{width:100px;height:1px;background:rgba(185,152,58,.14);margin:6px auto 0}

#nameWrap{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);
  overflow:hidden;z-index:10;padding:8px 0 2px}
#champName{display:block;font-size:3.8rem;font-weight:900;letter-spacing:14px;
  text-transform:uppercase;white-space:nowrap;
  transform:translateY(110%);transition:transform .95s cubic-bezier(.16,1,.3,1)}
#nameWrap.show #champName{transform:translateY(0)}
#nameLine{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  height:1px;width:0;background:currentColor;opacity:.25;
  transition:width 1.1s cubic-bezier(.16,1,.3,1) .5s}
#nameWrap.show #nameLine{width:100%}

#teamRow{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;opacity:0;
  transition:opacity .8s .7s ease;z-index:10}
.tl2{height:1px;width:54px;background:currentColor;opacity:.28}
#teamLabel{font-size:.55rem;letter-spacing:8px;font-weight:600;text-transform:uppercase;white-space:nowrap}

#animName{position:fixed;top:28px;right:28px;font-size:.44rem;letter-spacing:2px;
  color:rgba(180,148,58,.15);z-index:10;line-height:1.8;text-align:right}

#ui{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
.btn{padding:9px 26px;border-radius:0;cursor:pointer;font-family:'Rajdhani',sans-serif;
  font-size:.65rem;letter-spacing:5px;font-weight:700;border:1px solid;
  transition:all .25s;background:transparent;text-transform:uppercase}
.b{border-color:rgba(48,96,205,.35);color:rgba(78,128,218,.65)}
.b:hover{background:rgba(28,68,178,.12);border-color:rgba(88,142,228,.5)}
.r{border-color:rgba(178,30,42,.35);color:rgba(205,64,76,.65)}
.r:hover{background:rgba(155,18,28,.12);border-color:rgba(212,70,80,.5)}
.g{border-color:rgba(180,148,58,.18);color:rgba(180,148,58,.5)}
.g:hover{background:rgba(180,148,58,.07);border-color:rgba(185,155,62,.38)}

#load{position:fixed;inset:0;background:#000;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .9s}
.lt{font-size:1.1rem;font-weight:900;letter-spacing:18px;color:rgba(185,152,56,.75);text-transform:uppercase}
.lb{width:160px;height:1px;background:rgba(255,255,255,.04);overflow:hidden}
.lf{height:100%;background:linear-gradient(90deg,rgba(30,70,182,.8),rgba(185,152,56,.8));width:0;transition:width .35s}
.ls{font-size:.44rem;letter-spacing:7px;color:rgba(148,163,184,.18)}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="load"><div class="lt">Champion Select</div><div class="lb"><div class="lf" id="lf"></div></div><div class="ls" id="ls">초기화 중...</div></div>
<div id="vignette"></div>
<div id="lbT"></div><div id="lbB"></div>
<div class="bkt tl" id="bTL"></div><div class="bkt tr" id="bTR"></div>
<div class="bkt bl" id="bBL"></div><div class="bkt br" id="bBR"></div>
<canvas id="c"></canvas>
<div id="phase"><span id="phaseTop">Pick Phase — Champion Reveal</span><div id="phaseLine"></div></div>
<div id="nameWrap"><span id="champName"></span><div id="nameLine"></div></div>
<div id="teamRow"><div class="tl2" id="tlL"></div><span id="teamLabel"></span><div class="tl2" id="tlR"></div></div>
<div id="animName"></div>
<div id="ui">
  <button class="btn b" onclick="window.doReveal('blue')">Blue Pick</button>
  <button class="btn r" onclick="window.doReveal('red')">Red Pick</button>
  <button class="btn g" onclick="window.nextAnim()">Anim ↺</button>
</div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass}     from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass}from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass}     from 'three/addons/postprocessing/ShaderPass.js';
import {GLTFLoader}     from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment}from 'three/addons/environments/RoomEnvironment.js';

const $=id=>document.getElementById(id);
const setLoad=(p,m)=>{$('lf').style.width=p+'%';$('ls').textContent=m;};
const W=innerWidth,H=innerHeight;

/* ── Renderer ─── */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=3.0;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture; pmrem.dispose();
scene.fog=new THREE.FogExp2(0x000000,.018);

const camera=new THREE.PerspectiveCamera(42,W/H,.1,200);

/* ── Post-processing ─── */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.5,.44,.82);
composer.addPass(bloom);

const caPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},amt:{value:.0010}},
  vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float amt;varying vec2 v;
    void main(){vec2 d=(v-.5)*amt;gl_FragColor=vec4(texture2D(tDiffuse,v-d).r,texture2D(tDiffuse,v).g,texture2D(tDiffuse,v+d).b,1.);}`
});
composer.addPass(caPass);

const grainPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},time:{value:0},amt:{value:.018}},
  vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float time;uniform float amt;varying vec2 v;
    float rnd(vec2 c){return fract(sin(dot(c*700.+time,vec2(12.9898,78.233)))*43758.5453);}
    void main(){vec4 c=texture2D(tDiffuse,v);gl_FragColor=vec4(c.rgb+(rnd(v)-.5)*amt,c.a);}`
});
composer.addPass(grainPass);

/* ── 바닥 ─── */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({color:0x010812,roughness:.94,metalness:.03,envMapIntensity:.08}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

/* ═══════════════════════════════════════════════════════
   소환 빔 — 4개 레이어, 원뿔형 (위=좁고 아래=넓음)
   CylinderGeometry는 로컬 원점 중심(-h/2 ~ +h/2)
   setBeamY(champY)로 빔 하단을 챔피언 발바닥에 맞춤
═══════════════════════════════════════════════════════ */
const BEAM_H=22;
function mkBeam(tR,bR,col,op){
  const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(tR,bR,BEAM_H,48,1,true),m);
  scene.add(mesh); return mesh;
}
const beamCore  =mkBeam(.014,.014,0xffffff,0); // 흰색 레이저 코어
const beamInner =mkBeam(.04,.10, 0xffffff,0); // 내부 글로우 (흰색→팀컬러)
const beamMid   =mkBeam(.14,.45, 0x8899ff,0); // 팀컬러 원뿔 중간
const beamOuter =mkBeam(.55,2.0, 0x4466cc,0); // 넓은 대기 원뿔

// 수평 스캔밴드 (하강 중 위→아래 스위프)
const scanMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const scanBand=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.07,48,1,false),scanMat);
scene.add(scanBand);

function setBeamY(champY){
  // 빔 하단=champY, 중심=champY+BEAM_H/2
  const py=champY+BEAM_H/2;
  beamCore.position.y=py; beamInner.position.y=py;
  beamMid.position.y=py; beamOuter.position.y=py;
}

/* ── 지면 예비 글로우 (착지 전 앤티시페이션) ─── */
const anticMat=new THREE.MeshBasicMaterial({color:0x2244aa,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const anticGlow=new THREE.Mesh(new THREE.CircleGeometry(5,64),anticMat);
anticGlow.rotation.x=-Math.PI/2; anticGlow.position.y=.003; scene.add(anticGlow);

/* ── 착지 임팩트 플래시 ─── */
const flashMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const impactFlash=new THREE.Mesh(new THREE.CircleGeometry(8,64),flashMat);
impactFlash.rotation.x=-Math.PI/2; impactFlash.position.y=.01; scene.add(impactFlash);

/* ── 충격파 링 3개 (착지 후 순차 확장) ─── */
function mkSW(r0,r1,col){
  const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(new THREE.RingGeometry(r0,r1,96),m);
  mesh.rotation.x=-Math.PI/2; mesh.position.y=.02; scene.add(mesh); return{mesh,mat:m};
}
const sw1=mkSW(.7,.85,0xffffff);
const sw2=mkSW(1.3,1.48,0xffffff);
const sw3=mkSW(2.1,2.28,0xffffff);

/* ── 착지 파티클 버스트 ─── */
const BURST_N=120;
const burstGeo=new THREE.BufferGeometry();
const burstPos=new Float32Array(BURST_N*3);
// 원본 속도 저장 (재사용 시 누적 방지)
const burstVelOrig=[];
const burstVel=[];
for(let i=0;i<BURST_N;i++){
  const a=Math.random()*Math.PI*2;
  const el=Math.random()*.45*Math.PI; // 방사각
  const sp=1.8+Math.random()*4.2;
  const vx=Math.cos(a)*Math.cos(el)*sp, vy=Math.sin(el)*sp+.8, vz=Math.sin(a)*Math.cos(el)*sp;
  burstVelOrig.push({vx,vy,vz});
  burstVel.push({vx,vy,vz,life:1});
  burstPos[i*3]=0; burstPos[i*3+1]=.1; burstPos[i*3+2]=0;
}
burstGeo.setAttribute('position',new THREE.BufferAttribute(burstPos,3));
const burstPts=new THREE.Points(burstGeo,new THREE.PointsMaterial({
  size:.055,color:0xffffff,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(burstPts);
let burstActive=false,burstT=0;

/* ── 룬 서클 4개 + 틱 마크 + 디스크 ─── */
function mkRing(r,w,col){
  const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const mesh=new THREE.Mesh(new THREE.RingGeometry(r-w,r,128),m);
  mesh.rotation.x=-Math.PI/2; mesh.position.y=.012; scene.add(mesh); return mesh;
}
const runeA=mkRing(1.2,.006,0x4466cc);
const runeB=mkRing(1.88,.005,0x3355aa);
const runeC=mkRing(2.38,.006,0x4466cc);
const runeD=mkRing(2.82,.004,0x2244aa);

function mkTick(r,len,cnt,col){
  const v=[];
  for(let i=0;i<cnt;i++){const a=(i/cnt)*Math.PI*2;
    v.push(Math.cos(a)*(r-len),0,Math.sin(a)*(r-len),Math.cos(a)*r,0,Math.sin(a)*r);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));
  const m=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
  const l=new THREE.LineSegments(g,m);
  l.rotation.x=-Math.PI/2; l.position.y=.013; scene.add(l); return l;
}
const tickA=mkTick(1.55,.1,16,0x4466cc);
const tickB=mkTick(2.55,.18,24,0x3355aa);

const discMat=new THREE.MeshBasicMaterial({color:0x1133aa,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const disc=new THREE.Mesh(new THREE.CircleGeometry(1.72,64),discMat);
disc.rotation.x=-Math.PI/2; disc.position.y=.011; scene.add(disc);

/* ── 대기 부유 파티클 ─── */
const FPN=55;
const fpP=new Float32Array(FPN*3),fpV=new Float32Array(FPN),fpO=new Float32Array(FPN*2);
for(let i=0;i<FPN;i++){
  const a=Math.random()*Math.PI*2,r=.25+Math.random()*1.6;
  fpO[i*2]=Math.cos(a)*r; fpO[i*2+1]=Math.sin(a)*r;
  fpP[i*3]=fpO[i*2]; fpP[i*3+1]=Math.random()*5; fpP[i*3+2]=fpO[i*2+1];
  fpV[i]=.06+Math.random()*.14;
}
const fpGeo=new THREE.BufferGeometry();
fpGeo.setAttribute('position',new THREE.BufferAttribute(fpP,3));
const floatPts=new THREE.Points(fpGeo,new THREE.PointsMaterial({
  size:.02,color:0x6688bb,transparent:true,opacity:.26,
  blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(floatPts);

/* ── 조명 ─── */
scene.add(new THREE.AmbientLight(0x0a1520,2.6));
scene.add(new THREE.HemisphereLight(0x151d2e,0x060c14,1.4));

const heroSpot=new THREE.SpotLight(0xfff4e0,0,26,Math.PI/4,.3);
heroSpot.position.set(0,9,3.5); heroSpot.target.position.set(0,1,0);
heroSpot.castShadow=true; heroSpot.shadow.mapSize.set(2048,2048);
scene.add(heroSpot); scene.add(heroSpot.target);

const rimLight=new THREE.DirectionalLight(0x1a44b8,0);
rimLight.position.set(0,5,-6); scene.add(rimLight);

scene.add(Object.assign(new THREE.DirectionalLight(0xfff0e0,2.5),{position:new THREE.Vector3(0,3,7)}));
scene.add(Object.assign(new THREE.DirectionalLight(0x7788aa,1.3),{position:new THREE.Vector3(-5,3,3)}));
scene.add(Object.assign(new THREE.DirectionalLight(0xaa9977,.9),{position:new THREE.Vector3(5,3,3)}));

const tLight=new THREE.PointLight(0x1a44b8,0,14);
tLight.position.set(0,.5,1.5); scene.add(tLight);

/* ── 카메라 유틸 ─── */
function setCam(theta,radius,height,lookY=1.9){
  camera.position.set(Math.sin(theta)*radius,height,Math.cos(theta)*radius);
  camera.lookAt(0,lookY,0);
}
let camSwayT=0;
let mx=0,my=0;
addEventListener('mousemove',e=>{mx=(e.clientX/W-.5)*2;my=(e.clientY/H-.5)*2;});

/* ── GLB 로더 ─── */
let mixer=null,model=null,animList=[],animIdx=0,currentAction=null;
let modelScale=1,modelBaseY=0;

new GLTFLoader().load('/models/ambessa.glb',
  gltf=>{
    setLoad(90,'처리 중...');
    model=gltf.scene; scene.add(model);
    const box=new THREE.Box3().setFromObject(model);
    const sz=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
    modelScale=4.5/Math.max(sz.x,sz.y,sz.z);
    model.scale.setScalar(modelScale);
    modelBaseY=-box.min.y*modelScale;
    model.position.set(-ctr.x*modelScale,modelBaseY,-ctr.z*modelScale);
    model.visible=false;
    model.traverse(n=>{
      if(!n.isMesh) return;
      n.castShadow=true; n.receiveShadow=true;
      const mats=Array.isArray(n.material)?n.material:[n.material];
      mats.forEach(m=>{
        if(m.map) m.map.colorSpace=THREE.SRGBColorSpace;
        if(m.envMapIntensity!==undefined) m.envMapIntensity=3.5;
        if(m.emissiveIntensity>0) m.emissiveIntensity=Math.min(m.emissiveIntensity*1.4,1.8);
        if(m.roughness!==undefined) m.roughness=Math.min(m.roughness,.38);
        if(m.color) m.color.multiplyScalar(2.2);
        m.needsUpdate=true;
      });
    });
    mixer=new THREE.AnimationMixer(model);
    animList=gltf.animations;
    if(animList.length>0){playAnim(0);$('animName').textContent=`[${animList.length}] ${animList[0].name}`;}
    setLoad(100,'완료');
    setTimeout(()=>{$('load').style.opacity='0';
      setTimeout(()=>$('load').style.display='none',900);
      setTimeout(()=>doReveal('blue'),1100);
    },300);
  },
  xhr=>{setLoad(xhr.total?Math.round((xhr.loaded/xhr.total)*45)+45:70,`${(xhr.loaded/1024/1024).toFixed(1)}MB`);},
  err=>{$('ls').style.color='#c44';$('ls').textContent='로드 실패: '+err.message;}
);

function playAnim(idx){
  if(!mixer||!animList[idx]) return;
  const next=mixer.clipAction(animList[idx]);
  if(currentAction&&currentAction!==next){currentAction.fadeOut(.3);next.reset().fadeIn(.3).play();}
  else next.play();
  currentAction=next; animIdx=idx;
  $('animName').textContent=`[${idx+1}/${animList.length}] ${animList[idx].name}`;
}

/* ── 이징 함수 ─── */
let revealed=false,runeOn=false;
const eOut5=t=>1-Math.pow(1-t,5);
const eOut3=t=>1-Math.pow(1-t,3);
const eIn  =t=>Math.pow(t,2.2);
const eIO  =t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp =(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const norm =(v,a,b)=>clamp((v-a)/(b-a),0,1);

function typeText(el,text,ms=520){
  el.textContent=''; [...text].forEach((c,i)=>setTimeout(()=>el.textContent+=c,i/text.length*ms));
}

/* ── 팀 팔레트 ─── */
const PAL={
  blue:{col:0x2255cc,rim:0x1a3eb2,tl:0x1a44b8,text:'#4d7dd4',label:'Blue Team',
        beamCol:0x4488ff,beamMid:0x6699ff,anticCol:0x1133bb},
  red: {col:0xcc2232,rim:0x991020,tl:0xbb2232,text:'#c83244',label:'Red Team',
        beamCol:0xff4433,beamMid:0xff6655,anticCol:0xaa1122}
};

/* ═══════════════════════════════════════════
   메인 리빌 함수
═══════════════════════════════════════════ */
async function doReveal(team){
  revealed=false; runeOn=false; burstActive=false; camSwayT=0;
  const P=PAL[team];
  const tc=new THREE.Color(P.col), bc=new THREE.Color(P.beamCol), mc=new THREE.Color(P.beamMid);

  /* ── 팀컬러 적용 ─── */
  rimLight.color.setHex(P.rim); tLight.color.setHex(P.tl);
  floatPts.material.color.copy(bc);
  [runeA,runeB,runeC,runeD].forEach(r=>r.material.color.copy(tc));
  [tickA,tickB].forEach(t=>t.material.color.copy(tc));
  discMat.color.copy(tc);
  [sw1,sw2,sw3].forEach(s=>s.mat.color.copy(bc));
  flashMat.color.copy(bc);
  burstPts.material.color.copy(bc);
  anticMat.color.setHex(P.anticCol);
  beamCore.material.color.set(0xffffff);
  beamInner.material.color.set(0xffffff);
  beamMid.material.color.copy(mc);
  beamOuter.material.color.copy(bc);
  scanMat.color.copy(bc);

  /* ── 전체 초기화 ─── */
  heroSpot.intensity=0; rimLight.intensity=0; tLight.intensity=0; bloom.strength=0;
  caPass.uniforms.amt.value=.001;
  [beamCore,beamInner,beamMid,beamOuter].forEach(b=>b.material.opacity=0);
  scanMat.opacity=0;
  anticMat.opacity=0; anticGlow.scale.setScalar(1);
  flashMat.opacity=0; impactFlash.scale.setScalar(1);
  [sw1,sw2,sw3].forEach(s=>{s.mat.opacity=0;s.mesh.scale.setScalar(1);});
  burstPts.material.opacity=0;
  [runeA,runeB,runeC,runeD].forEach(r=>r.material.opacity=0);
  [tickA,tickB].forEach(t=>t.material.opacity=0);
  discMat.opacity=0;

  /* ── 파티클 버스트 리셋 (원본 속도 복원) ─── */
  for(let i=0;i<BURST_N;i++){
    burstPos[i*3]=0; burstPos[i*3+1]=.1; burstPos[i*3+2]=0;
    burstVel[i].vx=burstVelOrig[i].vx; burstVel[i].vy=burstVelOrig[i].vy;
    burstVel[i].vz=burstVelOrig[i].vz; burstVel[i].life=1;
  }
  burstGeo.attributes.position.needsUpdate=true;

  /* ── UI 초기화 ─── */
  ['bTL','bTR','bBL','bBR'].forEach(id=>$(id).classList.remove('show'));
  $('nameWrap').classList.remove('show'); $('champName').textContent='';
  $('teamRow').style.opacity='0';
  $('lbT').style.transform='translateY(0)';
  $('lbB').style.transform='translateY(0)';

  /* ── 챔피언 초기 위치 (화면 밖 상공) ─── */
  const startY=modelBaseY+9;
  if(model){model.visible=false;model.scale.setScalar(modelScale);
    model.position.set(model.position.x,startY,model.position.z);model.rotation.y=0;}

  /* ── 카메라: 측면 로우앵글 시작 ─── */
  setCam(Math.PI*.38,3.2,.55,-.3);

  /* ═══════════════════════════════════════════════
     PHASE 0 (0→10%): 빔 강타 — 챔피언 아직 숨김
     빔이 먼저 하늘에서 내려쳐 지면을 밝힘
  ═══════════════════════════════════════════════ */
  const BEAM_START=.0, BEAM_FULL=.10, LAND=.60;
  const DUR=2200;
  let landed=false;
  const t0=Date.now();

  await new Promise(res=>{
    (function tk(){
      const raw=Math.min((Date.now()-t0)/DUR,1);

      /* ═══════════════════════════ PHASE 0: 빔 등장 ═══════ */
      if(raw<BEAM_FULL){
        const fp=norm(raw,BEAM_START,BEAM_FULL);
        const bi=eOut5(fp);

        // 빔 위치: 상공에 고정 (챔피언 출발점)
        setBeamY(startY);

        // 빔 강도 (코어→내부→외부 순서로 등장)
        beamCore.material.opacity=bi*.95;
        beamInner.material.opacity=bi*.7;
        beamMid.material.opacity=bi*.35;
        beamOuter.material.opacity=bi*.12;

        // 스캔밴드: 빔 꼭대기에서 출발
        scanMat.opacity=bi*.9;
        scanBand.position.y=startY+BEAM_H*.5;

        // 지면 예비 글로우 (빔이 비추는 원)
        anticMat.opacity=bi*.25;
        anticGlow.scale.setScalar(1+bi*.4);

        // 카메라: 살짝 위를 보며 빔 등장 감상
        const theta=Math.PI*.38;
        const camH=lerp(.55,.75,bi);
        camera.position.set(Math.sin(theta)*3.2,camH,Math.cos(theta)*3.2);
        camera.lookAt(0,lerp(-.3,2.5,eOut3(fp)),0);

        // 빔 등장 bloom
        bloom.strength=fp<.5?eOut5(fp/.5)*2.8:lerp(2.8,.4,eOut3((fp-.5)/.5));
        heroSpot.intensity=bi*8;

      /* ═══════════════════════════ PHASE 1: 하강 ═══════════ */
      } else if(raw<LAND){
        const fp=norm(raw,BEAM_FULL,LAND);
        const fe=eIn(fp);
        const champY=lerp(startY,modelBaseY,fe);

        // 챔피언 하강
        if(model){
          if(!model.visible) model.visible=true;
          model.position.y=champY;
        }

        // 빔이 챔피언과 함께 내려옴
        setBeamY(champY);

        // 빔 강도: 하강하면서 점점 밝아짐
        const bi=lerp(.85,1.0,fp);
        beamCore.material.opacity=bi*.95;
        beamInner.material.opacity=bi*.72;
        beamMid.material.opacity=bi*lerp(.35,.55,fp);
        beamOuter.material.opacity=bi*lerp(.12,.28,fp);

        // 스캔밴드: 빔 위→아래 반복 스위프 (2회)
        const scanCycle=2; // 2번 스위프
        const scanFrac=(fp*scanCycle)%1;
        const scanFe=eIn(scanFrac);
        scanBand.position.y=champY+BEAM_H*(1-scanFe);
        scanMat.opacity=(.5+scanFrac*.5)*.85*(1-Math.pow(Math.abs(scanFrac-.5)/.5,2)*.3);

        // 지면 예비 글로우: 챔피언 가까워질수록 밝아짐
        anticMat.opacity=lerp(.2,.55,eOut3(fp));
        anticGlow.scale.setScalar(lerp(1.4,.85,fe));

        // 카메라: 챔피언 추적하며 옆→정면으로
        const theta=Math.PI*.38*(1-eIO(fp))*.32;
        const radius=lerp(3.2,3.85,fp);
        const camH=lerp(.75,1.2,fp);
        camera.position.set(Math.sin(theta)*radius,camH,Math.cos(theta)*radius);
        camera.lookAt(0,champY+1.4,0);

        heroSpot.intensity=lerp(8,18,eOut3(fp));
        bloom.strength=lerp(.4,.5,fp);

      /* ═══════════════════════════ PHASE 2: 착지 ═══════════ */
      } else {
        if(!landed){
          landed=true;
          if(model){model.visible=true;model.position.y=modelBaseY;}
          // 파티클 버스트 시작
          burstActive=true; burstT=0;
        }

        const ap=norm(raw,LAND,1);

        /* ─ 빔 소멸 ─ */
        const beamFade=Math.max(0,1-eOut5(ap/.22));
        beamCore.material.opacity=beamFade*.95;
        beamInner.material.opacity=beamFade*.72;
        beamMid.material.opacity=beamFade*.55;
        beamOuter.material.opacity=beamFade*.28;
        scanMat.opacity=beamFade*.85;
        setBeamY(modelBaseY);

        /* ─ 임팩트 플래시 ─ */
        if(ap<.1) flashMat.opacity=eOut5(ap/.1)*.9;
        else       flashMat.opacity=Math.max(0,.9-eOut3((ap-.1)/.9)*1.4);
        impactFlash.scale.setScalar(1+ap*3.5);

        /* ─ 지면 글로우 → 폭발 ─ */
        anticMat.opacity=Math.max(0,.55-eOut5(ap/.4)*.55);

        /* ─ 착지 스쿼시/스트레치 ─ */
        if(ap<.18&&model){
          const sq=Math.sin(norm(ap,0,.18)*Math.PI);
          model.scale.set(modelScale*(1+sq*.12),modelScale*(1-sq*.15),modelScale*(1+sq*.12));
        } else if(model) model.scale.setScalar(modelScale);

        /* ─ 색수차 스파이크 ─ */
        if(ap<.06) caPass.uniforms.amt.value=lerp(.001,.038,ap/.06);
        else       caPass.uniforms.amt.value=Math.max(.001,lerp(.038,.001,(ap-.06)/.94));

        /* ─ 블룸 스파이크 ─ */
        if(ap<.06) bloom.strength=.5+eOut5(ap/.06)*4.5;
        else       bloom.strength=Math.max(.5,5.0-eOut3((ap-.06)/.94)*4.5);

        /* ─ 카메라 착지 풀백 + 진동 ─ */
        const theta=Math.PI*.38*(1-eOut5(ap))*.06;
        const radius=3.85+eOut3(ap)*.55;
        const camH=lerp(1.2,1.48,eOut3(ap));
        setCam(theta,radius,camH);
        if(ap<.07){const sh=(1-ap/.07)*.025;camera.position.x+=(Math.random()-.5)*sh;camera.position.y+=Math.random()*sh*.6;}

        /* ─ 충격파 3개 순차 확장 ─ */
        {const s=ap;sw1.mesh.scale.setScalar(1+s*9);sw1.mat.opacity=Math.max(0,(1-s)*.85);}
        if(ap>.06){const s=norm(ap,.06,1);sw2.mesh.scale.setScalar(1+s*11);sw2.mat.opacity=Math.max(0,(1-s)*.65);}
        if(ap>.14){const s=norm(ap,.14,1);sw3.mesh.scale.setScalar(1+s*13);sw3.mat.opacity=Math.max(0,(1-s)*.45);}

        /* ─ 조명 페이드인 ─ */
        rimLight.intensity=eOut3(ap)*5.0;
        tLight.intensity=eOut3(ap)*2.4;
        heroSpot.intensity=lerp(18,20,eOut3(ap));

        /* ─ 룬 순차 등장 (안쪽→바깥쪽) ─ */
        if(ap>.14){
          const re=eOut5(norm(ap,.14,.65));
          runeA.material.opacity=re*.72; tickA.material.opacity=re*.65; discMat.opacity=re*.16;
        }
        if(ap>.24){const re=eOut5(norm(ap,.24,.72)); runeB.material.opacity=re*.55;}
        if(ap>.34){const re=eOut5(norm(ap,.34,.78)); runeC.material.opacity=re*.64; tickB.material.opacity=re*.55;}
        if(ap>.44){const re=eOut5(norm(ap,.44,.88)); runeD.material.opacity=re*.38;}
      }

      if(raw<1) requestAnimationFrame(tk); else res();
    })();
  });

  /* ─ 최종 정리 ─ */
  bloom.strength=.55; caPass.uniforms.amt.value=.001;
  [beamCore,beamInner,beamMid,beamOuter].forEach(b=>b.material.opacity=0);
  scanMat.opacity=0; anticMat.opacity=0;
  if(model){model.scale.setScalar(modelScale);model.position.y=modelBaseY;}
  runeOn=true; revealed=true;

  /* ─ UI 등장 ─ */
  setTimeout(()=>{$('lbT').style.transform='translateY(-100%)';$('lbB').style.transform='translateY(100%)';},60);
  setTimeout(()=>['bTL','bTR','bBL','bBR'].forEach(id=>$(id).classList.add('show')),200);
  $('nameWrap').classList.add('show');
  setTimeout(()=>{
    $('champName').style.color='#ffffff';
    typeText($('champName'),'앰베사',560);
  },220);
  const lbl=$('teamLabel'),row=$('teamRow');
  lbl.textContent=P.label; lbl.style.color=P.text;
  $('tlL').style.color=P.text; $('tlR').style.color=P.text;
  $('nameLine').style.color=P.text;
  row.style.opacity='1';
}

/* ── 렌더 루프 ─── */
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta(),t=clock.elapsedTime;
  if(mixer) mixer.update(dt);
  grainPass.uniforms.time.value=t*.35;

  /* ─ 부유 파티클 상승 ─ */
  const pa=fpGeo.attributes.position;
  for(let i=0;i<FPN;i++){
    pa.array[i*3+1]+=fpV[i]*dt;
    if(pa.array[i*3+1]>5){
      pa.array[i*3+1]=0;
      pa.array[i*3]  =fpO[i*2]  +(Math.random()-.5)*.12;
      pa.array[i*3+2]=fpO[i*2+1]+(Math.random()-.5)*.12;
    }
  }
  pa.needsUpdate=true;

  /* ─ 버스트 파티클 ─ */
  if(burstActive){
    burstT+=dt;
    const bp=burstGeo.attributes.position;
    let totalLife=0,aliveCount=0;
    for(let i=0;i<BURST_N;i++){
      burstVel[i].life-=dt*.95;
      if(burstVel[i].life>0){
        totalLife+=burstVel[i].life; aliveCount++;
        bp.array[i*3]  +=burstVel[i].vx*dt;
        bp.array[i*3+1]+=burstVel[i].vy*dt;
        bp.array[i*3+2]+=burstVel[i].vz*dt;
        burstVel[i].vy-=4.8*dt; // 중력
      }
    }
    bp.needsUpdate=true;
    // 파티클 opacity: 등장(빠르게)→소멸(수명 따라)
    const avgLife=aliveCount>0?totalLife/aliveCount:0;
    burstPts.material.opacity=Math.min(burstT*10,1)*avgLife*.78;
    if(aliveCount===0) burstActive=false;
  }

  /* ─ 룬 회전 + 펄스 ─ */
  if(runeOn){
    runeA.rotation.y= t*.44; runeB.rotation.y=-t*.27;
    runeC.rotation.y= t*.15; runeD.rotation.y=-t*.09;
    tickA.rotation.y=t*.44; tickB.rotation.y=-t*.15;
    const p=.48+Math.sin(t*.82)*.1;
    runeA.material.opacity=p*.74; runeB.material.opacity=p*.57;
    runeC.material.opacity=p*.66; runeD.material.opacity=p*.4;
    tickA.material.opacity=p*.65; tickB.material.opacity=p*.54;
    discMat.opacity=.13+Math.sin(t*.6)*.02;
  }

  /* ─ 아이들 모션 ─ */
  if(revealed&&model){
    model.position.y=modelBaseY+Math.sin(t*.56)*.024;
    model.rotation.y+=(mx*.1-model.rotation.y)*.032;
    heroSpot.intensity=17+Math.sin(t*.38)*.8;
    rimLight.intensity=4.2+Math.sin(t*.46)*.6;
    tLight.intensity=2.0+Math.sin(t*.7)*.28;
    camSwayT+=dt;
    setCam(Math.sin(camSwayT*.12)*.28+mx*.07, 4.3+Math.sin(camSwayT*.09)*.18, 1.44-my*.06);
  }

  composer.render();
})();

window.doReveal=doReveal;
window.nextAnim=()=>{const idx=(animIdx+1)%animList.length;playAnim(idx);};
</script>
</body>
